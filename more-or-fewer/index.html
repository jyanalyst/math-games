<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; media-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>More, Fewer, Altogether – Bar Model Game</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --ink:#2d3047; --soft:#6b6f86;
    --a:#7c6cf0; --a2:#b3a9ff; --b:#22a39f; --moved:#f2a541; --gap:#ef6f6c;
    --ok:#2e9d5b; --line:#2d3047; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:20px;line-height:1.4;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .app{max-width:1200px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  header h1{font-size:21px;margin:0;flex:1 1 auto}
  header{gap:10px}
  .stars{font-size:22px;font-weight:700;background:#fff3c4;border-radius:999px;padding:8px 16px;min-height:48px;display:flex;align-items:center}
  .toggle{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;min-height:48px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .toggle .sw{width:56px;height:36px;border-radius:999px;background:#d6d6e0;position:relative;transition:background .2s}
  .toggle .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle[aria-pressed="true"] .sw{background:var(--b)}
  .toggle[aria-pressed="true"] .sw::after{left:24px}
  .layout{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:900px) and (orientation:landscape){ .layout{grid-template-columns:1.35fr 1fr;align-items:start} }
  @media (min-width:1100px){ .layout{grid-template-columns:1.35fr 1fr;align-items:start} }
  .card{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
  .progress{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .progress span{width:26px;height:26px;border-radius:50%;background:#ece7f8;display:flex;align-items:center;justify-content:center;font-size:16px}
  .progress span.done{background:#ffd84d}
  .progress span.cur{outline:3px solid var(--a)}
  .story{font-size:22px;margin:0 0 6px}
  .question{font-size:22px;font-weight:700;margin:6px 0 0;color:#4b3fc4}
  .steps{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
  .steps span{font-size:16px;padding:4px 10px;border-radius:999px;background:#eee;color:var(--soft)}
  .steps span.on{background:var(--a);color:#fff}
  .steps span.past{background:#d9f2e3;color:var(--ok)}
  /* bars */
  .bars{position:relative;padding:10px 0 4px}
  .caption{min-height:62px;font-size:20px;background:#f4f1ff;border-radius:14px;padding:10px 14px;margin-bottom:8px}
  .row{display:flex;align-items:flex-start;gap:10px;margin:4px 0}
  .rowname{width:110px;flex:0 0 110px;font-weight:700;font-size:20px;padding-top:18px;text-align:right;overflow-wrap:anywhere}
  .track{position:relative;flex:1 1 auto;height:104px}
  .seg{position:absolute;top:8px;height:56px;border-radius:8px}
  .seg.main{background-color:var(--a)}
  .row.B .seg.main{background-color:var(--b)}
  .seg.extra{background-color:var(--a2);border:3px solid var(--a)}
  .seg.gain{background-color:var(--moved)}
  .seg.hole{background:repeating-linear-gradient(135deg,rgba(239,111,108,.18) 0 8px,rgba(239,111,108,.05) 8px 16px);border:3px dashed var(--gap)}
  .seg.blocks{background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--u) - 3px),rgba(255,255,255,.95) calc(var(--u) - 3px),rgba(255,255,255,.95) var(--u))}
  .seg .inlab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .lab{position:absolute;top:70px;transform:translateX(-50%);font-size:18px;font-weight:700;white-space:nowrap;padding:1px 8px;border-radius:8px;background:#fff;transition:opacity .3s;z-index:4}
  .lab.extra{color:var(--a)} .lab.gain{color:#b26b00} .lab.hole{color:var(--gap)}
  .lab.flash{animation:flash 1.2s ease 2}
  @keyframes flash{50%{background:#fff3a0;transform:translateX(-50%) scale(1.15)}}
  .dotline{position:absolute;top:0;bottom:0;width:0;border-left:4px dashed var(--line);pointer-events:none;z-index:3}
  .dotlab{position:absolute;bottom:-30px;transform:translateX(-50%);font-size:16px;color:var(--soft);white-space:nowrap;z-index:3;background:var(--card);padding:0 6px}
  .counter{text-align:center;font-size:18px;color:var(--soft);min-height:26px;margin-top:30px}
  .barbtns{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  /* panel */
  .panel h2{font-size:22px;margin:0 0 10px}
  .big{min-height:64px;padding:12px 22px;border-radius:16px;font-size:22px;font-weight:700;background:var(--a);color:#fff;box-shadow:0 4px 0 #5143c4}
  .big:active{transform:translateY(3px);box-shadow:0 1px 0 #5143c4}
  .big.green{background:var(--ok);box-shadow:0 4px 0 #1f7442}
  .big.orange{background:var(--moved);box-shadow:0 4px 0 #b97a1c;color:#3a2600}
  .ghost{min-height:52px;padding:8px 16px;border-radius:14px;background:#eeeaff;color:#4b3fc4;font-weight:700;font-size:19px}
  .choices{display:flex;gap:10px;flex-wrap:wrap}
  .choice{flex:1 1 30%;min-height:64px;border-radius:16px;background:#f1f0f7;font-size:21px;font-weight:700;border:3px solid transparent;padding:8px}
  .choice.sel{border-color:var(--a);background:#e7e2ff}
  .ansline{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:21px;flex-wrap:wrap}
  .ansbox{min-width:120px;min-height:56px;border-radius:12px;background:#fff8e1;border:3px solid #f2d27a;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 10px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .pad button{min-height:58px;border-radius:14px;background:#f1f0f7;font-size:26px;font-weight:700;box-shadow:0 3px 0 #d8d6e6}
  .pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #d8d6e6}
  .feedback{min-height:30px;font-size:20px;margin:8px 0;padding:0}
  .feedback.good{color:var(--ok);font-weight:700}
  .feedback.try{color:#b5462f}
  .hint{background:#fff8e1;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:19px}
  .rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .prompt{font-size:26px;font-weight:800;text-align:center;margin:10px 0;color:#4b3fc4}
  .center{text-align:center}
  .bigstar{font-size:64px;text-align:center;animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .muted{color:var(--soft);font-size:18px}
  .foot{margin-top:14px;text-align:center}
  .foot button{background:none;color:var(--soft);font-size:16px;text-decoration:underline;min-height:48px;padding:0 12px}
  .ctl{min-height:48px;min-width:48px;padding:6px 12px;border-radius:999px;background:#fff;font-size:17px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .ctl[disabled]{opacity:.4}
  .modesw{display:flex;align-items:center;gap:0;background:#fff;border-radius:999px;padding:4px;min-height:48px;box-shadow:0 2px 0 rgba(0,0,0,.06);font-size:17px;font-weight:700}
  .modesw span{padding:8px 12px;border-radius:999px;color:var(--soft)}
  .modesw span.on{background:var(--a);color:#fff}
  .startcard .note{font-size:17px;color:var(--soft);margin:10px 0 0}
  .ctl.off{background:#eee;color:var(--soft)}
  .startscreen{position:fixed;inset:0;z-index:50;background:rgba(253,246,236,.97);display:flex;align-items:center;justify-content:center;padding:20px}
  .startcard{background:#fff;border-radius:24px;padding:30px 26px;max-width:560px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.07)}
  .startcard h2{font-size:30px;margin:6px 0 8px}
  .startcard .bigemoji{font-size:64px}
  .startcard .big{width:100%;margin-top:16px;font-size:26px;min-height:76px}
  .startcard .quiet{margin-top:12px;background:none;color:var(--soft);text-decoration:underline;min-height:48px;font-size:18px}
  .life{background:#eefaf3;border:3px solid #bfe8cf;border-radius:18px;padding:14px 16px;margin:6px 0}
  .life .lemoji{font-size:44px;text-align:center;line-height:1.2}
  .life h3{margin:4px 0 6px;font-size:22px;color:#1f7442;text-align:center}
  .life p{margin:6px 0;font-size:20px}
  .life .ba{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .life .ba span{background:#fff;border-radius:12px;padding:6px 12px;font-size:18px;font-weight:700}
  .life .rule{font-size:18px;color:#1f7442;font-weight:700;text-align:center}
  /* working step */
  .seg.hl{box-shadow:0 0 0 4px #ffd84d,0 0 16px 4px rgba(255,190,0,.75);z-index:2;animation:glow 1.6s ease-in-out infinite}
  .lab.hl{background:#fff3a0;box-shadow:0 0 0 3px #ffd84d}
  .seg.diffbox{top:2px;height:68px;background:rgba(255,216,77,.30);border:3px dashed #d99a00;border-radius:10px;z-index:3;pointer-events:none}
  .question.hl{background:#fff3c4;border-radius:10px;box-shadow:0 0 0 4px #ffd84d;padding:0 6px}
  @keyframes glow{50%{box-shadow:0 0 0 6px #ffd84d,0 0 22px 8px rgba(255,190,0,.9)}}
  .sheet{background:#fffdf5;border:2px solid #efe6c8;border-left:6px solid #f2a7a7;border-radius:12px;padding:4px 10px;margin:4px 0 8px}
  .wline{display:flex;align-items:flex-start;gap:10px;padding:5px 4px;border-bottom:1px dashed #e8dfc4;width:100%;text-align:left;background:none;border-radius:8px}
  .wline:last-child{border-bottom:none}
  .wline.on{background:#fff3c4}
  .wline.next{color:var(--soft)}
  .wnum{flex:0 0 auto;min-width:30px;height:28px;border-radius:999px;background:#ece7f8;color:#4b3fc4;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-top:2px}
  .wbody{display:flex;flex-direction:column}
  .weq{font-size:22px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .wst,.wans{font-size:18px;line-height:1.3}
  .wans{font-weight:700}
  .wcheck .weq{color:var(--ok)}
  .tag{margin-top:2px;font-size:12px;color:#9a9aa8;letter-spacing:.5px}
  .wask{font-size:19px;font-weight:700;margin:6px 0 8px}
  .wintro{margin:0 0 6px;font-size:17px}
  .wchoices .choice{min-height:56px;font-size:20px;padding:6px}
  .wchoices.sent .choice{flex:1 1 100%;min-height:50px;font-size:18px;text-align:left;padding:6px 12px}
  .choice.no{border-color:#e9a28f;background:#fdeee9}
  .why{background:#eef6ff;border:2px solid #cfe3fb;border-radius:14px;padding:8px 12px;font-size:18px;margin:6px 0}
  .whyh{font-weight:800;color:#2b5aa8;margin-bottom:2px}
  .why .from{margin-top:4px;font-size:16px;color:var(--soft)}
  .checklist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .tick{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;background:#f1f0f7;border-radius:14px;text-align:left;padding:6px 12px;font-size:17px;font-weight:600}
  .tick[aria-pressed="true"]{background:#d9f2e3}
  .tick .box{font-size:22px}
  .big[disabled]{opacity:.45}
  .wlist{margin:4px 0 8px;padding-left:22px;font-size:18px}
  @media (prefers-reduced-motion:reduce){ .bigstar,.lab.flash,.seg.hl{animation:none} }
  @media (max-width:600px){ .rowname{width:80px;flex-basis:80px;font-size:18px} header h1{font-size:20px} }
  /* iPad landscape (1024px): keep the header on one row */
  @media (min-width:900px) and (max-width:1180px){
    header{gap:8px} header h1{font-size:19px}
    .ctl{padding:6px 10px;font-size:16px} .modesw{font-size:16px} .modesw span{padding:8px 10px}
    .toggle{padding:4px 12px 4px 4px;gap:8px;font-size:17px} .toggle .sw{width:48px;height:32px} .toggle .sw::after{width:24px;height:24px} .toggle[aria-pressed="true"] .sw::after{left:20px}
    .stars{font-size:20px;padding:6px 12px}
  }
  /* shared engine: generic bar model */
  .bars{padding:4px 0}
  #model{position:relative}
  .track{height:64px}
  .track.withunder{height:104px}
  .rowname{padding-top:12px}
  .seg{top:6px;height:46px;transition:width .35s ease,left .35s ease}
  .seg .inlab{font-size:17px}
  .row.B .seg.unit,.row.B .seg.main{background-color:var(--b)}
  .row.C .seg.main,.row.C .seg.unit{background-color:#e07bb3}
  .seg.unit{background-color:var(--a)}
  .seg.ghostu{background:transparent;border:3px dashed var(--a2)}
  .seg.left{background:repeating-linear-gradient(135deg,#f2a541 0 8px,#f7c98a 8px 16px)}
  .seg.left .inlab{color:#3a2600;text-shadow:none}
  .seg.dots{background:transparent;border-top:4px dotted var(--a);border-bottom:4px dotted var(--a);border-radius:0}
  .seg.dots .inlab{color:var(--a);text-shadow:none;font-size:22px}
  .seg.cut{background:repeating-linear-gradient(135deg,rgba(239,111,108,.35) 0 8px,rgba(239,111,108,.12) 8px 16px);border:3px dashed var(--gap)}
  .seg.cut .inlab{color:#9c2f2c;text-shadow:none}
  .seg.fresh{animation:grow .45s ease}
  @keyframes grow{0%{transform:scaleX(.2);transform-origin:left;opacity:.3}100%{transform:scaleX(1);opacity:1}}
  .tail{position:absolute;top:14px;font-size:20px;font-weight:800;color:#4b3fc4;white-space:nowrap;background:#fff;border-radius:8px;padding:0 6px}
  .tail.hl{background:#fff3a0;box-shadow:0 0 0 3px #ffd84d}
  .ubrace{position:absolute;top:58px;height:14px;border:4px solid #d99a00;border-top:none;border-radius:0 0 12px 12px;pointer-events:none;z-index:3}
  .ubrace.hl{box-shadow:0 0 0 4px #ffd84d}
  .ublab{position:absolute;top:74px;transform:translateX(-50%);font-size:16px;font-weight:800;color:#8a5a00;background:#fff3c4;border-radius:10px;padding:1px 8px;white-space:nowrap;z-index:4}
  .ublab.hl{box-shadow:0 0 0 3px #ffd84d}
  .brace{position:absolute;pointer-events:none;z-index:3;border:4px solid #d99a00;border-left:none;border-radius:0 16px 16px 0;width:18px}
  .brace.hl{box-shadow:0 0 0 4px #ffd84d,0 0 16px 4px rgba(255,190,0,.75)}
  .bracelab{position:absolute;font-size:17px;font-weight:800;color:#8a5a00;background:#fff3c4;border-radius:10px;padding:2px 8px;white-space:nowrap;z-index:4;line-height:1.2;text-align:center}
  .bracelab.hl{box-shadow:0 0 0 3px #ffd84d}
  .cntrow{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
  .cntrow .ansbox{min-width:90px}
  .emptyrow{color:var(--soft);font-size:16px;padding-top:18px}
  .counter{margin-top:4px}
  .seg.ghostu .inlab{color:#5a4fc0;text-shadow:none}
  /* timeline (time game) */
  .tl{position:relative;height:210px;margin:4px 14px 0}
  .tl-line{position:absolute;left:0;right:0;top:112px;height:5px;background:#4b3fc4;border-radius:3px}
  .tl-empty{position:absolute;top:30px;left:0;right:0;text-align:center}
  .tl-tick{position:absolute;top:100px;width:5px;height:30px;margin-left:-2px;background:#4b3fc4;border-radius:2px}
  .tl-tick span{position:absolute;top:34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:16px;color:#2b2b3a;background:#fff;padding:1px 5px;border-radius:8px}
  .tl-tick.ask span{color:#4b3fc4;background:#efeaff}
  .tl-tick.hl span{background:#fff3a0;box-shadow:0 0 0 3px #ffd84d}
  .tl-jump{position:absolute;top:58px;height:52px;border:4px solid #e07bb3;border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0;box-sizing:border-box}
  .tl-jump.hr{border-color:#7c6cf0}
  .tl-jump span{position:absolute;top:-28px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:16px;color:#7a2d5a;background:#fff;padding:0 5px;border-radius:8px}
  .tl-jump.hr span{color:#4b3fc4}
  .tl-jump.hl{box-shadow:0 -6px 14px 2px rgba(255,190,0,.75);border-color:#e0a800}
  .tl-jump.hl span{background:#fff3a0;box-shadow:0 0 0 3px #ffd84d}
  .tl-total{position:absolute;top:162px;height:12px;border:4px solid #d99a00;border-top:none;border-radius:0 0 12px 12px;box-sizing:border-box}
  .tl-totlab{position:absolute;top:178px;transform:translateX(-50%);font-size:16px;font-weight:800;color:#8a5a00;background:#fff3c4;border-radius:10px;padding:1px 8px;white-space:nowrap}
  .tl-total.hl,.tl-totlab.hl{box-shadow:0 0 0 4px #ffd84d}
  /* area and perimeter diagram */
  .ap{position:relative;height:260px}
  .ap-empty{position:absolute;top:30px;left:0;right:0;text-align:center}
  .ap-rect{position:absolute;border:4px solid #4b3fc4;border-radius:4px;box-sizing:border-box;background:#fff}
  .ap-rect.grid{background-image:linear-gradient(to right,rgba(75,63,196,.35) 1px,transparent 1px),linear-gradient(to bottom,rgba(75,63,196,.35) 1px,transparent 1px)}
  .ap-rect.shade{background-color:#dcd6ff}
  .ap-rect.around{border-color:#e07bb3;border-style:dashed}
  .ap-rect.hl{box-shadow:0 0 0 5px #ffd84d,0 0 18px 6px rgba(255,190,0,.7)}
  .ap-cnt{position:absolute;background:rgba(255,216,77,.55);border:3px solid #d99a00;box-sizing:border-box;pointer-events:none}
  .ap-lab{position:absolute;transform:translateX(-50%);font-weight:800;font-size:17px;background:#fff;padding:1px 6px;border-radius:8px;white-space:nowrap;color:#2b2b3a}
  .ap-lab.side{transform:translateX(-100%)} .ap-lab.side.r{transform:none}
  .ap-lab.hl,.ap-in.hl,.ap-ar.hl{background:#fff3a0;box-shadow:0 0 0 3px #ffd84d}
  .ap-in{position:absolute;transform:translateX(-50%);font-weight:800;font-size:17px;color:#4b3fc4;background:rgba(255,255,255,.85);padding:1px 8px;border-radius:10px;white-space:nowrap}
  .ap-ar{position:absolute;transform:translateX(-50%);font-weight:800;font-size:16px;color:#7a2d5a;background:#fde8f3;padding:1px 8px;border-radius:10px;white-space:nowrap}
  .pad .padwide{grid-column:1 / -1}
</style>
</head>
<body>
<div class="startscreen" id="startScreen">
  <div class="startcard">
    <div class="bigemoji">🧩⚖️</div>
    <h2>More, Fewer, Altogether</h2>
    <p>Two groups to <b>compare</b>. Find the missing bar first, then put them <b>together</b> or find <b>how many more</b>. Your tutor will help, step by step.</p>
    <p class="note" id="startNote"></p>
    <button class="big" id="startTutor">Start with my tutor 🔊</button>
    <button class="quiet" id="startQuiet">Play without sound</button>
  </div>
</div>
<div class="app">
  <header>
    <h1>More, Fewer, Altogether</h1>
    <button class="modesw" id="modeBtn" aria-label="Switch between Lesson mode and Practice mode"><span data-m="lesson">📘 Lesson</span><span data-m="practice">🎲 Practice</span></button>
    <button class="toggle" id="smallToggle" aria-pressed="false"><span class="sw"></span><span>Small numbers</span></button>
    <button class="ctl" id="muteBtn" aria-pressed="false">🔊 Voice on</button>
    <button class="ctl" id="againBtn">🔁 Say it again</button>
    <div class="stars" id="stars">★ 0</div>
  </header>
  <div class="layout">
    <div>
      <div class="card">
        <div class="progress" id="progress"></div>
        <p class="story" id="story"></p>
        <p class="question" id="question"></p>
        <div class="steps" id="steps"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="caption" id="caption"></div>
        <div class="bars" id="bars"><div id="model"></div></div>
        <div class="counter" id="counter"></div>
        <div class="barbtns" id="barbtns"></div>

function renderBarBtns(){ $("barbtns").innerHTML=""; }

/* ---------- panels ---------- */
function renderPanel(){
  var el=$("panel"), h="";
  if(cur.phase==="predict"){
    h+='<h2>1. Make a guess</h2><p>'+esc(cur.guess.q)+' There is no wrong guess!</p>';
    h+='<div class="choices">'+cur.guess.choices.map(function(c){return '<button class="choice" data-pred="'+esc(c[0])+'">'+esc(c[1])+'</button>';}).join("")+'</div>';
  } else if(cur.phase==="build"){
    var steps=G.build(P), s=steps[cur.b];
    h+='<h2>2. Draw the model ✏️</h2>'+(cur.b===0&&cur.prediction?'<p class="muted">'+esc(guessNote())+'</p>':'');
    h+='<p class="wask" id="bask">'+esc(s.ask)+'</p>';
    if(s.type==="count"){
      h+='<div class="cntrow"><button class="ghost" id="cMinus" aria-label="take one away">− 1</button><span class="ansbox" id="cnt">'+cur.count+'</span><button class="ghost" id="cPlus" aria-label="add one">+ 1 '+esc(s.unitName||"unit")+'</button></div>';
      h+='<div class="rowbtns"><button class="big green" id="cDone">That\'s right ✓</button></div>';
    } else {
      h+='<div class="choices wchoices sent">'+s.choices.map(function(c,i){ return '<button class="choice'+(cur.bfb&&cur.bfb.i===i?' no':'')+'" data-bc="'+i+'">'+esc(c[1])+'</button>'; }).join('')+'</div>';
    }
    h+='<div class="feedback'+(cur.bfb?' try':'')+'" id="bfb">'+(cur.bfb?esc(cur.bfb.msg):'')+'</div>';
    h+='<p class="muted">Step '+(cur.b+1)+' of '+steps.length+'</p>';
  } else if(cur.phase==="answer"){
    var al=G.answerLine(P);
    h+='<h2>3. Your answer</h2>';
    h+='<div class="ansline"><span>'+esc(al[0])+'</span><span class="ansbox" id="ansbox">'+(esc(typedShow())||"&nbsp;")+'</span><span>'+esc(al[1])+'</span></div>';
    h+='<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(k){return '<button data-k="'+k+'">'+k+'</button>';}).join("")+(dotPad()?'<button data-k="." aria-label="point">.</button><button data-k="0">0</button><button data-k="del" aria-label="delete">⌫</button><button data-k="clr" class="padwide">C</button>':'<button data-k="del" aria-label="delete">⌫</button><button data-k="0">0</button><button data-k="clr">C</button>')+'</div>';
    h+='<div class="feedback'+(cur.fb?' '+cur.fb.cls:'')+'" id="feedback">'+(cur.fb?esc(cur.fb.msg):'')+'</div>';
    h+=hintHTML();
    h+='<div class="rowbtns"><button class="big green" id="checkBtn">Check ✓</button>'+(cur.hints<3?'<button class="ghost" id="hintBtn">Hint '+(cur.hints+1)+' of 3</button>':'')+'</div>';
  } else if(cur.phase==="working"){
    h+=renderWorking();
  } else if(cur.phase==="life"){
    h+=lifeHTML(cur.life)+'<div class="rowbtns" style="justify-content:center"><button class="big green" id="lifeBtn">Next problem ➡️</button></div>';
  }
  el.innerHTML=h; bindPanel();
}
function dotPad(){ return !!(G.decimalPad && G.decimalPad(P)); }
function typedShow(){ return G.fmtTyped ? G.fmtTyped(cur.typed, P) : cur.typed; }
function hintList(p){ return G.hints(p||P); }
function hintHTML(){ var h="", hs=hintList(); for(var i=0;i<cur.hints;i++) h+='<div class="hint">💡 '+esc(hs[i])+'</div>'; return h; }
function feedback(cls,msg){ cur.fb={cls:cls,msg:msg}; var f=$("feedback"); f.className="feedback "+cls; f.innerHTML=esc(msg); }
function check(){
  if(cur.typed===""){ feedback("try","Type your answer on the number pad."); tell("Type your answer on the number pad."); return; }
  var v=G.parseTyped ? G.parseTyped(cur.typed,P) : parseInt(cur.typed,10);
  if(v===null){ var fm=G.formatMsg(P,cur.typed); feedback("try",fm); tell(fm); return; }
  if(v===P.answer){
    cur.solved=true; S.results[S.idx]={prediction:cur.prediction, predictionRight:cur.prediction===cur.guess.right, tries:cur.tries+1, hints:cur.hints};
    startWorking(); renderAll(); tell(G.praise(P), workingEntryLines().join(" ")); return;
  }
  cur.tries++; var msg=G.wrongMsg(P,v); feedback("try",msg); tell("That's okay, let's look again.", msg);
}
/* ---------- life cards ---------- */
function lifeCard(i){ return G.LIFE[((i%G.LIFE.length)+G.LIFE.length)%G.LIFE.length]; }
function lifeHTML(L){ return '<div class="life" id="lifeCard"><div class="lemoji">'+L.emoji+'</div><h3>Where do we use this in real life?</h3><p class="center" style="font-weight:700;margin:0">'+esc(L.title)+'</p><p>'+esc(L.text)+'</p><p class="rule">'+esc(L.rule)+'</p></div>'; }

/* ---------- working step UI (same pattern as Games 1 and 3) ---------- */
var FAST_FROM=3;
function isMemoryProblem(){ return S.idx===2; } // problem 3 of 5: write it all from memory first
function startWorking(){
  cur.plan=workingPlan(P);
  var memory=isMemoryProblem(), offer=!memory && S.idx>=FAST_FROM;
  cur.work={mode:memory?"memory":(offer?null:"guided"), stage:memory?"paper":(offer?"choose":"ask"), k:0, fb:null, wrong:0, ticks:cur.plan.checklist.map(function(){return false;}), open:-1, after:null};
  cur.hl = cur.work.stage==="ask" ? cur.plan.lines[0].hl : [];
  cur.phase="working";
}
function workingEntryLines(){ var w=cur.work; if(w.stage==="paper") return [WS.memory]; if(w.stage==="choose") return [WS.offer]; return [S.idx<2?WS.intro:WS.introShort, cur.plan.lines[0].ask]; }
function wLabel(L,i){ return L.answer?'Ans':(L.check?'Check':String(i+1)); }
function sheetHTML(upto,on,next,tap){
  var ls=cur.plan.lines, h='<div class="sheet" id="sheet">', tg=tap?'button':'div';
  for(var i=0;i<upto;i++){ var L=ls[i];
    h+='<'+tg+' class="wline'+(on===i?' on':'')+(L.check?' wcheck':'')+'" data-wl="'+i+'" id="wline'+i+'"><span class="wnum">'+wLabel(L,i)+'</span><span class="wbody">'+
      (L.answer?'<span class="wans">'+esc(L.stmt)+'</span>':'<span class="weq">'+esc(L.eq)+(L.check?' ✓':'')+'</span><span class="wst">'+esc(L.stmt)+'</span>')+'</span></'+tg+'>'; }
  if(next!=null){ var X=ls[next]; h+='<div class="wline next" id="wlineNext"><span class="wnum">'+wLabel(X,next)+'</span><span class="wbody">'+(X.answer?'Answer sentence?':(X.check?'Check?':'Number sentence?'))+'</span></div>'; }
  return h+'</div>';
}
function whyHTML(L){ return '<div class="why" id="whyBox"><div class="whyh">🤔 Why this line?</div>'+esc(L.why)+(L.check?'':'<div class="from">Comes from: <b>'+esc(L.tag)+'</b> (glowing on the model)</div>')+'</div>'; }
function renderWorking(){
  var w=cur.work, ls=cur.plan.lines, h='<h2>4. Write the working ✏️</h2>';
  if(w.stage==="choose"){
    h+='<p>Write the working on your own first, or build it with me line by line?</p><div class="rowbtns"><button class="big green" id="fastBtn">I can do it ✏️</button><button class="ghost" id="teachBtn">Teach me line by line</button></div>';
  } else if(w.stage==="paper"){
    h+='<p class="prompt">'+(w.mode==="memory"?'From memory ✏️':'Your turn ✏️')+'</p><p>'+(w.mode==="memory"?'Draw '+esc(G.drawWhat)+'. Then write:':'On your paper, write:')+'</p>';
    h+='<ul class="wlist"><li>each number sentence with a short statement</li><li>the answer sentence with the unit</li><li>a check: put the answer back and see if it works</li></ul><p class="muted">The model working stays hidden until you tap the button.</p><div class="rowbtns"><button class="big green" id="wroteBtn">I\'ve written it ✓</button></div>';
  } else if(w.stage==="ask"||w.stage==="why"){
    var shown=w.stage==="why"?w.k+1:w.k;
    if(w.stage==="ask" && w.k===0 && S.idx<2) h+='<p class="muted wintro">Each line: a number sentence, then a short statement. The last lines are the answer sentence and the check.</p>';
    h+=sheetHTML(shown, w.stage==="why"?w.k:null, w.stage==="ask"?w.k:null, false);
    if(w.stage==="ask"){ var L=ls[w.k];
      h+='<p class="wask" id="wask">'+esc(L.ask)+'</p><div class="choices wchoices'+(L.answer?' sent':'')+'">'+L.choices.map(function(c,i){ return '<button class="choice'+(w.fb&&w.fb.i===i?' no':'')+'" data-wc="'+i+'">'+esc(c.t)+'</button>'; }).join('')+'</div>';
      h+='<div class="feedback'+(w.fb?' try':'')+'" id="wfb">'+(w.fb?esc(w.fb.msg):'')+'</div>';
    } else { h+=whyHTML(ls[w.k]); h+='<div class="rowbtns">'+(w.k<ls.length-1?'<button class="big" id="nextLineBtn">Next line ➡️</button>':'<button class="big green" id="toPaperBtn">Now write it on paper ✏️</button>')+'</div>'; }
  } else if(w.stage==="check"){
    h+='<p class="wintro">'+(w.after==="compare"?'<b>Compare</b> with your paper.':'<b>Now write it on your paper.</b>')+' Tap a line to see why.</p>'+sheetHTML(ls.length,w.open,null,true);
    if(w.open>=0) h+=whyHTML(ls[w.open]);
    h+='<div class="checklist" id="checklist">'+cur.plan.checklist.map(function(t,i){ return '<button class="tick" data-tick="'+i+'" aria-pressed="'+(w.ticks[i]?'true':'false')+'"><span class="box">'+(w.ticks[i]?'✅':'⬜')+'</span><span>'+esc(t)+'</span></button>'; }).join('')+'</div>';
    var all=w.ticks.every(Boolean); h+='<div class="rowbtns"><button class="big green" id="workDoneBtn"'+(all?'':' disabled')+'>'+(all?'Done ✓':'Tick all '+w.ticks.length+' first')+'</button></div>';
  }
  return h;
}
function finalCaption(){ return G.caption(P, view()); }
function workCaption(){
  var w=cur.work; if(!w) return finalCaption();
  var i=(w.stage==="ask"||w.stage==="why")?w.k:(w.stage==="check"?w.open:-1);
  if(i<0) return finalCaption()+(w.stage==="paper"&&w.mode==="memory"?" Draw it on your paper.":"");
  var L=cur.plan.lines[i];
  return (L.answer?"The answer sentence":(L.check?"The check line":"Line "+(i+1)))+" comes from <b>"+esc(L.tag)+"</b>. Look for the glow ✨";
}
function workRefresh(){ setCaption(workCaption()); renderBars(); renderPanel(); }
function bindWorking(el){
  var w=cur.work; if(!w) return; var ls=cur.plan.lines;
  el.querySelectorAll("[data-wc]").forEach(function(b){ b.onclick=function(){ var L=ls[w.k], c=L.choices[+b.getAttribute("data-wc")];
    if(c.ok){ w.stage="why"; w.fb=null; workRefresh(); tell(L.say); }
    else { w.wrong++; w.fb={i:+b.getAttribute("data-wc"), msg:c.nudge}; cur.hl=L.hl; workRefresh(); tell(c.nudge); } }; });
  if($("nextLineBtn")) $("nextLineBtn").onclick=function(){ w.k++; w.stage="ask"; w.fb=null; cur.hl=ls[w.k].hl; workRefresh(); tell(ls[w.k].ask); };
  if($("toPaperBtn")) $("toPaperBtn").onclick=function(){ w.stage="check"; w.after="write"; w.open=-1; cur.hl=[]; workRefresh(); tell(WS.write); };
  if($("teachBtn")) $("teachBtn").onclick=function(){ w.mode="guided"; w.stage="ask"; w.k=0; cur.hl=ls[0].hl; workRefresh(); tell(WS.introShort, ls[0].ask); };
  if($("fastBtn")) $("fastBtn").onclick=function(){ w.mode="fast"; w.stage="paper"; cur.hl=[]; workRefresh(); tell(WS.fast); };
  if($("wroteBtn")) $("wroteBtn").onclick=function(){ w.stage="check"; w.after="compare"; w.open=-1; cur.hl=[]; workRefresh(); tell(WS.compare); };
  el.querySelectorAll("button[data-wl]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-wl"); w.open=i; cur.hl=ls[i].hl; workRefresh(); tell(ls[i].whySay); }; });
  el.querySelectorAll("[data-tick]").forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute("data-tick"); w.ticks[i]=!w.ticks[i]; renderPanel(); if(w.ticks.every(Boolean)) tell(WS.ticked); }; });
  if($("workDoneBtn")) $("workDoneBtn").onclick=function(){ if(!w.ticks.every(Boolean)) return;
    if(S.results[S.idx]) S.results[S.idx].working={mode:w.mode, wrongChoices:w.wrong};
    cur.hl=[]; afterWorking(); }; /* the Explain step was removed (Jeremy, 24 Oct 2026): go straight to the real-life card or the next problem */
}
/* ---------- build step: she draws the model ---------- */
function buildDone(s){
  cur.bfb=null; cur.fresh=cur.b; cur.b++; cur.count=0; var steps=G.build(P);
  if(cur.b>=steps.length){ cur.phase="answer"; cur.hl=[]; renderAll(); tell(s.done, G.answerAsk(P)); }
  else { renderAll(); tell(s.done, steps[cur.b].ask); }
}
function bindPanel(){
  var el=$("panel");
  el.querySelectorAll("[data-pred]").forEach(function(b){ b.onclick=function(){ cur.prediction=b.getAttribute("data-pred"); cur.phase="build"; cur.b=0; cur.count=0; renderAll();
    tell(guessNote(), "Now let's draw the model.", G.build(P)[0].ask); }; });
  el.querySelectorAll("[data-bc]").forEach(function(b){ b.onclick=function(){ var s=G.build(P)[cur.b], c=s.choices[+b.getAttribute("data-bc")];
    if(c[0]===s.right) buildDone(s); else { cur.bfb={i:+b.getAttribute("data-bc"), msg:c[2]}; renderPanel(); tell(c[2]); } }; });
  if($("cPlus")) $("cPlus").onclick=function(){ if(cur.count<12){ cur.count++; cur.fresh=-2; cur.bfb=null; renderBars(); $("cnt").textContent=cur.count; } };
  if($("cMinus")) $("cMinus").onclick=function(){ if(cur.count>0){ cur.count--; cur.bfb=null; renderBars(); $("cnt").textContent=cur.count; } };
  if($("cDone")) $("cDone").onclick=function(){ var s=G.build(P)[cur.b];
    if(cur.count===s.target) buildDone(s); else { var m=cur.count<s.target?s.low:s.high; cur.bfb={i:-1,msg:m}; renderPanel(); tell(m); } };
  el.querySelectorAll("[data-k]").forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-k");
    var lim=dotPad()?7:5;
    if(k==="del") cur.typed=cur.typed.slice(0,-1); else if(k==="clr") cur.typed="";
    else if(k==="."){ if(cur.typed.indexOf(".")<0 && cur.typed.length<lim) cur.typed=(cur.typed===""?"0":cur.typed)+"."; }
    else if(cur.typed.length<lim) cur.typed=(cur.typed==="0"?"":cur.typed)+k;
    $("ansbox").innerHTML=esc(typedShow())||"&nbsp;"; }; });
  if($("hintBtn")) $("hintBtn").onclick=function(){ cur.hints=Math.min(3,cur.hints+1); if(cur.hints>=2) cur.hl=G.hintHL(P); renderBars(); renderPanel(); tell("Here's a hint. "+hintList()[cur.hints-1].replace(/___/g,"blank")); };
  if($("checkBtn")) $("checkBtn").onclick=check;
  bindWorking(el);
  if($("lifeBtn")) $("lifeBtn").onclick=completeProblem;
}
var LIFE_AFTER=[1,3]; // after problems 2 and 4
function afterWorking(){
  if(LIFE_AFTER.indexOf(S.idx)>=0){ cur.life=lifeCard(S.lifeCount||0); S.lifeCount=(S.lifeCount||0)+1; save(); cur.phase="life"; renderAll(); tell("Where do we use this in real life? "+cur.life.text+" "+cur.life.rule); }
  else completeProblem();
}
function completeProblem(){ S.totalStars++; S.idx++; S.everPlayed=true; save(); startProblem(); }
function renderSummary(){
  renderHeader(); var res=S.results.filter(Boolean), pr=res.filter(function(r){return r.predictionRight;}).length;
  $("story").textContent="Round "+S.round+" finished! You got all "+ROUND_SIZE+" stars this round."; $("question").textContent=""; $("steps").innerHTML="";
  setCaption("Your guesses were right "+pr+" out of "+res.length+" times. "+G.summaryRule);
  $("model").innerHTML=""; $("barbtns").innerHTML="";
  var L=lifeCard(S.lifeCount||0); S.lifeCount=(S.lifeCount||0)+1; save();
  var btn = S.lesson ? '<button class="big" id="newRound">Play these 5 again</button><button class="ghost" id="toPractice">Try 5 new ones in Practice 🎲</button>'
                     : '<button class="big" id="moreBtn">5 more ➡️</button>';
  $("panel").innerHTML='<div class="bigstar">🌟</div><p class="prompt">Well done!</p><p class="center">Total stars: <b>'+S.totalStars+'</b></p>'+lifeHTML(L)+'<div class="rowbtns" style="justify-content:center">'+btn+'</div>';
  tell("You finished the round and got all "+ROUND_SIZE+" stars!", "Where do we use this in real life? "+L.text+" "+L.rule);
  var again=function(){ S.round++; S.idx=0; S.results=[]; S.problems=S.lesson?lessonProblems():makeRound(S.small); save(); startProblem(); };
  if($("newRound")) $("newRound").onclick=again;
  if($("moreBtn")) $("moreBtn").onclick=again;
  if($("toPractice")) $("toPractice").onclick=function(){ $("modeBtn").onclick(); };
}
function renderAll(){
  renderHeader(); renderStory();
  setCaption(cur.phase==="working"?workCaption():finalCaption());
  renderBars(); renderBarBtns(); renderPanel();
}
/* ---------- controls ---------- */
$("smallToggle").onclick=function(){
  if(isLesson()) return;
  S.small=!S.small; if(S.idx>=ROUND_SIZE){ save(); renderHeader(); return; }
  S.problems=makeRound(S.small,S.idx,S.problems); save(); startProblem(true);
  tell(S.small?"Small numbers are on.":"Big numbers are back on.", introLines());
};
$("resetBtn").onclick=function(){ if(!confirm("Start again from the beginning? Stars will go back to 0.")) return; Voice.stop(); S=isLesson()?freshLesson():fresh(); save(); startProblem(); };
function renderVoiceCtl(){
  var mb=$("muteBtn"), ab=$("againBtn"); mb.style.display=ab.style.display=Voice.supported?"":"none"; if(!Voice.supported) return;
  mb.textContent=Voice.muted?"🔇 Voice off":"🔊 Voice on"; mb.setAttribute("aria-pressed",Voice.muted?"true":"false"); mb.classList.toggle("off",Voice.muted); ab.disabled=Voice.muted;
}
$("muteBtn").onclick=function(){ Voice.setMuted(!Voice.muted); renderVoiceCtl(); if(!Voice.muted){ if(!Voice.started) Voice.unlock([]); Voice.again(); } };
$("againBtn").onclick=function(){ Voice.again(); };
function renderModeCtl(){
  var b=$("modeBtn"); b.querySelectorAll("[data-m]").forEach(function(s){ s.classList.toggle("on", s.getAttribute("data-m")===MODE); });
  b.setAttribute("aria-pressed", isLesson()?"false":"true");
  $("startNote").textContent = isLesson() ? "Lesson mode: 5 problems, from easy to exam level, read by this device's voice. Your progress is saved." : "Practice mode: 5 new random problems at a time, read by this device's voice.";
  $("startTutor").textContent = Voice.supported ? "Start with my tutor 🔊" : "Start ▶";
  $("startQuiet").style.display = Voice.supported ? "" : "none";
}
$("modeBtn").onclick=function(){
  Voice.stop(); save();
  MODE=isLesson()?"practice":"lesson"; try{ localStorage.setItem(MODE_KEY,MODE); }catch(e){}
  S=isLesson()?loadLesson():loadPractice(); save(); renderModeCtl(); startProblem(true);
  if(S.idx<ROUND_SIZE){ if(!Voice.started) Voice.unlock([introLines()]); else tell(introLines()); }
};
$("startTutor").onclick=function(){
  if(Voice.muted){ Voice.setMuted(false); renderVoiceCtl(); }
  $("startScreen").style.display="none";
  var first=(S.idx>=ROUND_SIZE)?["Hello! Welcome back."]:[(S.everPlayed||S.idx>0||S.round>1)?"Hello! Welcome back.":"Hello! I'm your maths tutor, and I'll help you, step by step.", introLines()];
  Voice.unlock(first); // speaking inside this tap unlocks speech on iPad Safari
};
$("startQuiet").onclick=function(){ Voice.setMuted(true); renderVoiceCtl(); $("startScreen").style.display="none"; Voice.unlock([]); };
renderModeCtl(); renderVoiceCtl();
window.addEventListener("resize",function(){ if(P && S.idx<ROUND_SIZE) renderBars(); });

/* every line the device voice could say in Lesson mode (for the recording-cost estimate) */
function lessonScript(){
  var out={}, add=function(t){ if(t) out[String(t).replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim()]=1; };
  var keepP=P, keepCur=cur;
  BANK.forEach(function(p,i){
    P=p; var g=G.guess(p,i); cur={guess:g, prediction:null};
    add(introLines()); g.choices.forEach(function(c){ add(g.note(c[0], c[0]===g.right)); });
    add("Now let's draw the model."); G.build(p).forEach(function(s){ add(s.ask); add(s.done); (s.choices||[]).forEach(function(c){ add(c[2]); }); add(s.low); add(s.high); });
    add(G.answerAsk(p));
    G.hints(p).forEach(function(h){ add("Here's a hint. "+h.replace(/___/g,"blank")); });
    G.wrongCandidates(p).forEach(function(v){ if(v!==p.answer) add(G.wrongMsg(p,v)); });
    add(G.praise(p));
    workingPlan(p).lines.forEach(function(L){ add(L.ask); add(L.say); add(L.whySay); L.choices.forEach(function(c){ add(c.nudge); }); });
  });
  for(var k in WS) add(WS[k]);
  G.LIFE.forEach(function(L){ add("Where do we use this in real life? "+L.text+" "+L.rule); });
  ["Hello! I'm your maths tutor, and I'll help you, step by step.","Hello! Welcome back.","That's okay, let's look again.","Type your answer on the number pad.","You finished the round and got all 5 stars!"].forEach(add);
  P=keepP; cur=keepCur;
  return Object.keys(out);
}
/* test hook (no personal data; used by automated checks) */
window.__game={answerText:ansText, typeFor:function(p,v){ v=(v==null?p.answer:v); return G.typeFor ? G.typeFor(p,v) : String(v); }, numsOf:function(t,p){ return NUMS(t,p); }, generate:generate, verify:verify, makeRound:makeRound, BANK:BANK, workingPlan:workingPlan, evalExpr:evalExpr, hintList:hintList, wrongMsg:function(p,v){return G.wrongMsg(p,v);},
  wrongCandidates:function(p){return G.wrongCandidates(p);}, build:function(p){return G.build(p);}, guess:function(p,i){return G.guess(p,i);}, testWrong:function(p){return G.testWrong(p);},
  storyText:function(p){return G.story(p);}, questionText:function(p){return G.question(p);}, answerSentence:function(p){return G.answerSentence(p);}, kinds:G.kinds, lessonScript:lessonScript, LIFE:G.LIFE, ROUND_SIZE:ROUND_SIZE, tag:G.tag,
  get state(){return S;}, get problem(){return P;}, get ui(){return cur;}, setSpeed:function(){}, voice:Voice, get mode(){return MODE;}};
save();
startProblem();
})();
