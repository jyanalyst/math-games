<body>
<div class="startscreen" id="startScreen">
  <div class="startcard">
    <div class="bigemoji">✖️🔢</div>
    <h2>Times Tables 6, 7, 8</h2>
    <p>A short daily practice: <b>12 facts</b> from the 6, 7 and 8 times tables. There is no clock. If a fact is tricky, you get a nearby fact to build it from, and it comes back later.</p>
    <p class="note" id="startNote"></p>
    <button class="big" id="tStart">Start with my tutor 🔊</button>
    <button class="quiet" id="tQuiet">Play without sound</button>
  </div>
</div>
<div class="app">
  <header>
    <h1>Times Tables 6, 7, 8</h1>
    <button class="ctl" id="muteBtn" aria-pressed="false">🔊 Voice on</button>
    <div class="stars" id="tStars">⭐ 0</div>
  </header>
  <div class="card tmain" id="tMain"></div>
  <div class="foot"><div class="tag" id="gameTag">Level P3 · P3-WNMD-TT-D01</div></div>
</div>

<!--HISTORY-START-->
<script>
var HISTORY_GAME = "times-tables";
/* ===== Practice history (schema v1): one entry per session, kept ONLY in this browser's localStorage =====
   No network code at all: nothing is ever sent anywhere. The home page shows the entries ('My practice history').
   A session starts when the round on screen starts (Start button, mode switch, next round, start again) and its entry
   is written when the round finishes, or saved when she leaves partway (pagehide / page hidden). An entry is only
   written once at least 1 problem is finished. Entries are upserted by id (one per session, never duplicated), and only
   the newest 200 are kept. Paper working steps are folded in as paper_done of paper_total (not counted as items).
   Fields (in this order): v, id, player, game_id, mode, started_at, ended_at, items_done, items_total, correct,
   score_pct, hints_used, paper_done, paper_total, mistakes, top_mistakes. Times are ISO with +08:00 (Singapore).
   mode is lesson | practice | test ("Test yourself" check-up, written by MathCheckup through record()). */
var MathHistory=(function(){
"use strict";
var GAME_ID="math-"+(typeof HISTORY_GAME==="string"?HISTORY_GAME:"unknown");
var KEY="mathgames.history.v1", PKEY="mathgames.player", MAX=200, TAGS=["answer","model","working"];
var sess=null, provider=null;
function p2(n){ return (n<10?"0":"")+n; }
function iso(t){ var d=new Date(t+8*3600000); return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())+"T"+p2(d.getUTCHours())+":"+p2(d.getUTCMinutes())+":"+p2(d.getUTCSeconds())+"+08:00"; }
function player(){ var n=""; try{ n=localStorage.getItem(PKEY)||""; }catch(e){} n=String(n).replace(/\s+/g," ").trim().slice(0,24); return n||"Player"; }
function newId(t){ var abc="abcdefghijklmnopqrstuvwxyz0123456789", out="", r=new Uint8Array(6);
  try{ crypto.getRandomValues(r); }catch(e){ for(var j=0;j<6;j++) r[j]=Math.floor(Math.random()*256); }
  for(var i=0;i<6;i++) out+=abc.charAt(r[i]%36); return t.toString(36)+"-"+out; }
function load(){ var a=[]; try{ a=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){} return Array.isArray(a)?a.filter(function(x){ return x && typeof x.id==="string"; }):[]; }
function entry(s){
  var m={}, top=[]; TAGS.forEach(function(k){ if(s.mistakes[k]>0){ m[k]=s.mistakes[k]; top.push(k); } });
  top.sort(function(a,b){ return (m[b]-m[a]) || (TAGS.indexOf(a)-TAGS.indexOf(b)); });
  return {v:1, id:s.id, player:s.player, game_id:GAME_ID, mode:s.mode, started_at:iso(s.t0), ended_at:iso(Date.now()),
    items_done:s.done, items_total:s.total, correct:s.correct, score_pct:s.done?Math.round(100*s.correct/s.done):0,
    hints_used:s.hints, paper_done:s.paperDone, paper_total:s.paperTotal, mistakes:m, top_mistakes:top};
}
// upsert by id, drop any duplicate ids, keep the newest MAX
function save(s){
  if(!s || !(s.done>0)) return false; // opening a game and leaving with nothing finished writes nothing
  var e=entry(s), a=load(), seen={}, out=[];
  for(var i=a.length-1;i>=0;i--){ var x=a[i]; if(seen[x.id] || x.id===e.id) continue; seen[x.id]=1; out.unshift(x); }
  out.push(e); if(out.length>MAX) out=out.slice(out.length-MAX);
  try{ localStorage.setItem(KEY, JSON.stringify(out)); return true; }catch(err){ return false; }
}
function state(){ try{ return provider ? provider() : null; }catch(e){ return null; } }
function begin(){
  var st=state(); sess=null;
  if(!st || !st.open || !(st.remaining>0)) return;
  var t=Date.now();
  sess={id:newId(t), player:player(), mode:st.mode==="practice"?"practice":"lesson", t0:t, done:0, total:st.remaining, correct:0, hints:0, mistakes:{}, paperDone:0, paperTotal:0};
}
window.addEventListener("pagehide", function(){ if(sess){ save(sess); sess=null; } });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden" && sess) save(sess); }); // same id: updated, never duplicated
window.addEventListener("pageshow", function(e){ if(e.persisted && !sess) begin(); });
return {gameId:GAME_ID, key:KEY,
  attach:function(f){ provider=f; },
  // start (or move to) the session for the round on screen; a session left partway with a problem finished is saved first
  restart:function(){ if(sess) save(sess); begin(); },
  miss:function(tag){ if(sess && TAGS.indexOf(tag)>=0) sess.mistakes[tag]=(sess.mistakes[tag]||0)+1; },
  hint:function(){ if(sess) sess.hints++; },
  item:function(ok, roundOver){ if(!sess) return; sess.done++; if(ok) sess.correct++;
    if(roundOver){ var wasLesson=sess.mode==="lesson"; save(sess); sess=null;
      if(wasLesson){ try{ window.dispatchEvent(new Event("mathgames:lessondone")); }catch(e){} } } }, // a finished Lesson round unlocks "Test yourself"
  // a "Test yourself" check-up (mode "test"): same fields and the same upsert as a round
  record:function(o){ return !!o && o.mode==="test" && save(o); },
  // a paper working step was offered (problem 3 from memory, or the "I can do it" choice) / she completed one
  paperOffer:function(){ if(sess) sess.paperTotal++; },
  // once per problem (keyed by the problems finished so far in this session); a Lesson step also earns 1 reward star
  // through the "mathgames:paperdone" event (MathCheckup keeps the key, so it is never counted twice)
  paper:function(){ if(!sess || sess.lastPaper===sess.done) return; sess.lastPaper=sess.done; sess.paperDone++;
    if(sess.mode==="lesson"){ try{ window.dispatchEvent(new CustomEvent("mathgames:paperdone",{detail:{key:sess.id+":"+sess.done}})); }catch(e){} } },
  // a round is on screen and not finished yet (the Home button asks once before leaving)

  else { h+='<div class="pad" id="tPad">'+[1,2,3,4,5,6,7,8,9].map(function(k){ return '<button data-k="'+k+'">'+k+'</button>'; }).join("")+'<button data-k="del" aria-label="delete">⌫</button><button data-k="0">0</button><button data-k="clr">C</button></div>';
    h+='<div class="rowbtns"><button class="big green" id="tCheck">Check ✓</button></div>'; }
  if(shaky.length) h+='<div class="shakybox" id="tShaky"><h3>Shaky today</h3><div class="chips">'+shaky.map(function(k){ var x=fact(k); return '<span class="chip'+(D.done[k]?' fixed':'')+'">'+esc(txt(x))+(D.done[k]?' ✓':'')+'</span>'; }).join("")+'</div><p class="muted">They come back until they are right.</p></div>';
  m.innerHTML=h;
  m.querySelectorAll("[data-k]").forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-k");
    if(k==="del") D.typed=D.typed.slice(0,-1); else if(k==="clr") D.typed=""; else if(D.typed.length<3) D.typed=(D.typed==="0"?"":D.typed)+k;
    $("tBox").innerHTML=esc(D.typed)||"&nbsp;"; }; });
  if($("tCheck")) $("tCheck").onclick=check;
  if($("tNext")) $("tNext").onclick=next;
}
function start(quiet){ D=fresh(); D.started=true; MathHistory.restart(); draw(); if(!quiet) tell(spokenFact(cur())); }
MathHistory.attach(function(){ return {mode:"practice", remaining:D?D.queue.filter(function(k,i,a){ return a.indexOf(k)===i; }).length:N, open:!!(D&&D.started&&!D.over)}; });
D=fresh(); 
$("tStart").onclick=function(){ $("startScreen").style.display="none"; if(typeof Voice!=="undefined" && Voice.muted){ Voice.setMuted(false); renderVoice(); } start(true); if(typeof Voice!=="undefined") Voice.unlock([SAY.hello, spokenFact(cur())]); };
$("tQuiet").onclick=function(){ if(typeof Voice!=="undefined"){ Voice.setMuted(true); Voice.unlock([]); } renderVoice(); $("startScreen").style.display="none"; start(true); };
function renderVoice(){ var b=$("muteBtn"); if(typeof Voice==="undefined" || !Voice.supported){ b.style.display="none"; return; } b.textContent=Voice.muted?"🔇 Voice off":"🔊 Voice on"; b.setAttribute("aria-pressed",Voice.muted?"true":"false"); }
$("muteBtn").onclick=function(){ Voice.setMuted(!Voice.muted); renderVoice(); };
renderVoice(); $("tStars").textContent="⭐ "+allStars();
var sh0=shakyKeys(mine(store())); if(sh0.length) $("startNote").textContent="Shaky from last time: "+sh0.slice(0,6).map(function(k){ return txt(fact(k)); }).join(", ")+". They come first today.";
/* test hook (no personal data) */
window.__drill={get D(){ return D; }, nudge:function(t,m,n){ return nudge({t:t,m:m,k:fk(t,m)}, n||1); }, strategy:function(t,m){ return strategy({t:t,m:m}); }, SAY:SAY, N:N, TABLES:TABLES, MULTS:MULTS, lines:function(){ var o=[]; for(var k in SAY) o.push(SAY[k]); return o; }};
})();
</script>

#ckBanner{left:140px}

#homeAsk{position:fixed;inset:0;z-index:90;background:rgba(30,30,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#homeAsk .hacard{background:#fff;border-radius:22px;padding:24px 26px;max-width:460px;width:100%;text-align:center;font-family:system-ui,-apple-system,sans-serif;box-shadow:0 8px 30px #0003}
#homeAsk h2{font-size:26px;margin:4px 0 8px}#homeAsk p{font-size:19px;color:#444;margin:0 0 18px}
#homeAsk .harow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

#homeYes{background:#4b3fd6;color:#fff;border:0}#homeStay{background:#fff;color:#2b2b3a;border:2px solid #ccd}
</style>
<script>
/* "🏠 Home" on every screen of the game (start screen, Lesson, Practice, paper steps, Test yourself, end screens).
   It goes back to the main menu (../#home). Everything she has done is already kept in this browser (progress, stars,
   history; the page saves again when it is left). Mid-round or mid-test it asks once: "Leave this game? Your stars so far
   are kept." (Yes / Stay). No network code, nothing timed, no voice. */
(function(){
  "use strict";
  function $(id){ return document.getElementById(id); }
  var HOME="../#home";
  function busy(){
    var ck=window.MathCheckup; if(ck && ck.open && ck.run && !ck.run.done && ck.run.phase!=="intro" && ck.run.phase!=="end") return true;
    var h=window.MathHistory; return !!(h && h.active && h.active());
  }
  function leave(){ try{ var ck=window.MathCheckup; if(ck && ck.open && window.MathHost && MathHost.stop) MathHost.stop(); }catch(e){} location.href=HOME; }
  function ask(){
    var d=$("homeAsk"); if(!d){ d=document.createElement("div"); d.id="homeAsk"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-labelledby","homeAskT");
      d.innerHTML='<div class="hacard"><h2 id="homeAskT">Leave this game?</h2><p>Your stars so far are kept.</p><div class="harow"><button type="button" id="homeYes">Yes, go Home</button><button type="button" id="homeStay">Stay</button></div></div>';
      document.body.appendChild(d); $("homeYes").onclick=leave; $("homeStay").onclick=function(){ d.hidden=true; }; }
    d.hidden=false; try{ $("homeStay").focus(); }catch(e){}
  }
  function init(){
    if($("homeBtn")) return;
    var b=document.createElement("button"); b.type="button"; b.id="homeBtn"; b.textContent="🏠 Home"; b.setAttribute("aria-label","Home: back to the main menu");
    b.onclick=function(){ if(busy()) ask(); else leave(); };
    document.body.appendChild(b);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();
  window.MathHome={busy:busy, ask:ask, href:HOME};
})();
</script>
