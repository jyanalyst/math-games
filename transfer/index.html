<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; media-src 'self'">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Moving Between Groups – Bar Model Game</title>
<style>
  :root{
    --bg:#fdf6ec; --card:#ffffff; --ink:#2d3047; --soft:#6b6f86;
    --a:#7c6cf0; --a2:#b3a9ff; --b:#22a39f; --moved:#f2a541; --gap:#ef6f6c;
    --ok:#2e9d5b; --line:#2d3047; --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:20px;line-height:1.4;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;cursor:pointer;border:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .app{max-width:1200px;margin:0 auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  header h1{font-size:21px;margin:0;flex:1 1 auto}
  header{gap:10px}
  .stars{font-size:22px;font-weight:700;background:#fff3c4;border-radius:999px;padding:8px 16px;min-height:48px;display:flex;align-items:center}
  .toggle{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 14px 6px 6px;min-height:48px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .toggle .sw{width:56px;height:36px;border-radius:999px;background:#d6d6e0;position:relative;transition:background .2s}
  .toggle .sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle[aria-pressed="true"] .sw{background:var(--b)}
  .toggle[aria-pressed="true"] .sw::after{left:24px}
  .layout{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:900px) and (orientation:landscape){ .layout{grid-template-columns:1.35fr 1fr;align-items:start} }
  @media (min-width:1100px){ .layout{grid-template-columns:1.35fr 1fr;align-items:start} }
  .card{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
  .progress{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .progress span{width:26px;height:26px;border-radius:50%;background:#ece7f8;display:flex;align-items:center;justify-content:center;font-size:16px}
  .progress span.done{background:#ffd84d}
  .progress span.cur{outline:3px solid var(--a)}
  .story{font-size:22px;margin:0 0 6px}
  .question{font-size:22px;font-weight:700;margin:6px 0 0;color:#4b3fc4}
  .steps{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
  .steps span{font-size:16px;padding:4px 10px;border-radius:999px;background:#eee;color:var(--soft)}
  .steps span.on{background:var(--a);color:#fff}
  .steps span.past{background:#d9f2e3;color:var(--ok)}
  /* bars */
  .bars{position:relative;padding:10px 0 4px}
  .caption{min-height:62px;font-size:20px;background:#f4f1ff;border-radius:14px;padding:10px 14px;margin-bottom:8px}
  .row{display:flex;align-items:flex-start;gap:10px;margin:4px 0}
  .rowname{width:110px;flex:0 0 110px;font-weight:700;font-size:20px;padding-top:18px;text-align:right;overflow-wrap:anywhere}
  .track{position:relative;flex:1 1 auto;height:104px}
  .seg{position:absolute;top:8px;height:56px;border-radius:8px}
  .seg.main{background-color:var(--a)}
  .row.B .seg.main{background-color:var(--b)}
  .seg.extra{background-color:var(--a2);border:3px solid var(--a)}
  .seg.gain{background-color:var(--moved)}
  .seg.hole{background:repeating-linear-gradient(135deg,rgba(239,111,108,.18) 0 8px,rgba(239,111,108,.05) 8px 16px);border:3px dashed var(--gap)}
  .seg.blocks{background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--u) - 3px),rgba(255,255,255,.95) calc(var(--u) - 3px),rgba(255,255,255,.95) var(--u))}
  .seg .inlab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .lab{position:absolute;top:70px;transform:translateX(-50%);font-size:18px;font-weight:700;white-space:nowrap;padding:1px 8px;border-radius:8px;background:#fff;transition:opacity .3s;z-index:4}
  .lab.extra{color:var(--a)} .lab.gain{color:#b26b00} .lab.hole{color:var(--gap)}
  .lab.flash{animation:flash 1.2s ease 2}
  @keyframes flash{50%{background:#fff3a0;transform:translateX(-50%) scale(1.15)}}
  .dotline{position:absolute;top:0;bottom:0;width:0;border-left:4px dashed var(--line);pointer-events:none;z-index:3}
  .dotlab{position:absolute;bottom:-30px;transform:translateX(-50%);font-size:16px;color:var(--soft);white-space:nowrap;z-index:3;background:var(--card);padding:0 6px}
  .counter{text-align:center;font-size:18px;color:var(--soft);min-height:26px;margin-top:30px}
  .barbtns{display:flex;gap:10px;justify-content:center;margin-top:6px;flex-wrap:wrap}
  /* panel */
  .panel h2{font-size:22px;margin:0 0 10px}
  .big{min-height:64px;padding:12px 22px;border-radius:16px;font-size:22px;font-weight:700;background:var(--a);color:#fff;box-shadow:0 4px 0 #5143c4}
  .big:active{transform:translateY(3px);box-shadow:0 1px 0 #5143c4}
  .big.green{background:var(--ok);box-shadow:0 4px 0 #1f7442}
  .big.orange{background:var(--moved);box-shadow:0 4px 0 #b97a1c;color:#3a2600}
  .ghost{min-height:52px;padding:8px 16px;border-radius:14px;background:#eeeaff;color:#4b3fc4;font-weight:700;font-size:19px}
  .choices{display:flex;gap:10px;flex-wrap:wrap}
  .choice{flex:1 1 30%;min-height:64px;border-radius:16px;background:#f1f0f7;font-size:21px;font-weight:700;border:3px solid transparent;padding:8px}
  .choice.sel{border-color:var(--a);background:#e7e2ff}
  .ansline{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:21px;flex-wrap:wrap}
  .ansbox{min-width:120px;min-height:56px;border-radius:12px;background:#fff8e1;border:3px solid #f2d27a;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 10px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
  .pad button{min-height:58px;border-radius:14px;background:#f1f0f7;font-size:26px;font-weight:700;box-shadow:0 3px 0 #d8d6e6}
  .pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #d8d6e6}
  .feedback{min-height:30px;font-size:20px;margin:8px 0;padding:0}
  .feedback.good{color:var(--ok);font-weight:700}
  .feedback.try{color:#b5462f}
  .hint{background:#fff8e1;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:19px}
  .rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .prompt{font-size:26px;font-weight:800;text-align:center;margin:10px 0;color:#4b3fc4}
  .center{text-align:center}
  .bigstar{font-size:64px;text-align:center;animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
  .muted{color:var(--soft);font-size:18px}
  .foot{margin-top:14px;text-align:center}
  .foot button{background:none;color:var(--soft);font-size:16px;text-decoration:underline;min-height:48px;padding:0 12px}
  .ctl{min-height:48px;min-width:48px;padding:6px 12px;border-radius:999px;background:#fff;font-size:17px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.06)}
  .ctl[disabled]{opacity:.4}
  .modesw{display:flex;align-items:center;gap:0;background:#fff;border-radius:999px;padding:4px;min-height:48px;box-shadow:0 2px 0 rgba(0,0,0,.06);font-size:17px;font-weight:700}
  .modesw span{padding:8px 12px;border-radius:999px;color:var(--soft)}
  .modesw span.on{background:var(--a);color:#fff}
  .startcard .note{font-size:17px;color:var(--soft);margin:10px 0 0}
  .ctl.off{background:#eee;color:var(--soft)}
  .startscreen{position:fixed;inset:0;z-index:50;background:rgba(253,246,236,.97);display:flex;align-items:center;justify-content:center;padding:20px}
  .startcard{background:#fff;border-radius:24px;padding:30px 26px;max-width:560px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.07)}
  .startcard h2{font-size:30px;margin:6px 0 8px}
  .startcard .bigemoji{font-size:64px}
  .startcard .big{width:100%;margin-top:16px;font-size:26px;min-height:76px}
  .startcard .quiet{margin-top:12px;background:none;color:var(--soft);text-decoration:underline;min-height:48px;font-size:18px}
  .life{background:#eefaf3;border:3px solid #bfe8cf;border-radius:18px;padding:14px 16px;margin:6px 0}
  .life .lemoji{font-size:44px;text-align:center;line-height:1.2}
  .life h3{margin:4px 0 6px;font-size:22px;color:#1f7442;text-align:center}
  .life p{margin:6px 0;font-size:20px}
  .life .ba{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .life .ba span{background:#fff;border-radius:12px;padding:6px 12px;font-size:18px;font-weight:700}
  .life .rule{font-size:18px;color:#1f7442;font-weight:700;text-align:center}
  /* working step */
  .seg.hl{box-shadow:0 0 0 4px #ffd84d,0 0 16px 4px rgba(255,190,0,.75);z-index:2;animation:glow 1.6s ease-in-out infinite}
  .lab.hl{background:#fff3a0;box-shadow:0 0 0 3px #ffd84d}
  .seg.diffbox{top:2px;height:68px;background:rgba(255,216,77,.30);border:3px dashed #d99a00;border-radius:10px;z-index:3;pointer-events:none}
  .question.hl{background:#fff3c4;border-radius:10px;box-shadow:0 0 0 4px #ffd84d;padding:0 6px}
  @keyframes glow{50%{box-shadow:0 0 0 6px #ffd84d,0 0 22px 8px rgba(255,190,0,.9)}}
  .sheet{background:#fffdf5;border:2px solid #efe6c8;border-left:6px solid #f2a7a7;border-radius:12px;padding:4px 10px;margin:4px 0 8px}
  .wline{display:flex;align-items:flex-start;gap:10px;padding:5px 4px;border-bottom:1px dashed #e8dfc4;width:100%;text-align:left;background:none;border-radius:8px}
  .wline:last-child{border-bottom:none}
  .wline.on{background:#fff3c4}
  .wline.next{color:var(--soft)}
  .wnum{flex:0 0 auto;min-width:30px;height:28px;border-radius:999px;background:#ece7f8;color:#4b3fc4;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;margin-top:2px}
  .wbody{display:flex;flex-direction:column}
  .weq{font-size:22px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .wst,.wans{font-size:18px;line-height:1.3}
  .wans{font-weight:700}
  .wcheck .weq{color:var(--ok)}
  .tag{margin-top:2px;font-size:12px;color:#9a9aa8;letter-spacing:.5px}
  .wask{font-size:19px;font-weight:700;margin:6px 0 8px}
  .wintro{margin:0 0 6px;font-size:17px}
  .wchoices .choice{min-height:56px;font-size:20px;padding:6px}
  .wchoices.sent .choice{flex:1 1 100%;min-height:50px;font-size:18px;text-align:left;padding:6px 12px}
  .choice.no{border-color:#e9a28f;background:#fdeee9}
  .why{background:#eef6ff;border:2px solid #cfe3fb;border-radius:14px;padding:8px 12px;font-size:18px;margin:6px 0}
  .whyh{font-weight:800;color:#2b5aa8;margin-bottom:2px}
  .why .from{margin-top:4px;font-size:16px;color:var(--soft)}
  .checklist{display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .tick{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;background:#f1f0f7;border-radius:14px;text-align:left;padding:6px 12px;font-size:17px;font-weight:600}
  .tick[aria-pressed="true"]{background:#d9f2e3}
  .tick .box{font-size:22px}
  .big[disabled]{opacity:.45}
  .wlist{margin:4px 0 8px;padding-left:22px;font-size:18px}
  @media (prefers-reduced-motion:reduce){ .bigstar,.lab.flash,.seg.hl{animation:none} }
  @media (max-width:600px){ .rowname{width:80px;flex-basis:80px;font-size:18px} header h1{font-size:20px} }
  /* iPad landscape (1024px): keep the header on one row */
  @media (min-width:900px) and (max-width:1180px){
    header{gap:8px} header h1{font-size:19px}
    .ctl{padding:6px 10px;font-size:16px} .modesw{font-size:16px} .modesw span{padding:8px 10px}
    .toggle{padding:4px 12px 4px 4px;gap:8px;font-size:17px} .toggle .sw{width:48px;height:32px} .toggle .sw::after{width:24px;height:24px} .toggle[aria-pressed="true"] .sw::after{left:20px}
    .stars{font-size:20px;padding:6px 12px}
  }
</style>

<body>
<div class="startscreen" id="startScreen">
  <div class="startcard">
    <div class="bigemoji">🧑‍🏫📊</div>
    <h2>Moving Between Groups</h2>
    <p>Your tutor will read each problem and help you, step by step.</p>
    <p class="note" id="startNote"></p>
    <button class="big" id="startTutor">Start the lesson 🔊</button>
    <button class="quiet" id="startQuiet">Play without sound</button>
  </div>
</div>
<div class="app">
  <header>
    <h1>Moving Between Groups</h1>
    <button class="modesw" id="modeBtn" aria-label="Switch between Lesson mode and Practice mode"><span data-m="lesson">📘 Lesson</span><span data-m="practice">🎲 Practice</span></button>
    <button class="toggle" id="smallToggle" aria-pressed="false"><span class="sw"></span><span>Small numbers</span></button>
    <button class="ctl" id="muteBtn" aria-pressed="false">🔊 Voice on</button>
    <button class="ctl" id="againBtn">🔁 Say it again</button>
    <div class="stars" id="stars">★ 0</div>
  </header>
  <div class="layout">
    <div>
      <div class="card">
        <div class="progress" id="progress"></div>
        <p class="story" id="story"></p>
        <p class="question" id="question"></p>
        <div class="steps" id="steps"></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="caption" id="caption"></div>
        <div class="bars" id="bars">
          <div class="row A"><div class="rowname" id="nameA"></div><div class="track" id="trackA"></div></div>
          <div class="row B"><div class="rowname" id="nameB"></div><div class="track" id="trackB"></div></div>
          <div class="dotline" id="dotline"><div class="dotlab" id="dotlab">dotted line</div></div>
        </div>
        <div class="counter" id="counter"></div>
        <div class="barbtns" id="barbtns"></div>
      </div>
    </div>
    <div class="card panel" id="panel"></div>
  </div>
  <div class="foot"><button id="resetBtn">Start again from the beginning</button><div class="tag" id="gameTag">Level P3 · P3-WNAS-IT-G01</div></div>
</div>

<!--HISTORY-START-->
<script>
var HISTORY_GAME = "transfer";
/* ===== Practice history (schema v1): one entry per session, kept ONLY in this browser's localStorage =====
   No network code at all: nothing is ever sent anywhere. The home page shows the entries ('My practice history').
   A session starts when the round on screen starts (Start button, mode switch, next round, start again) and its entry
   is written when the round finishes, or saved when she leaves partway (pagehide / page hidden). An entry is only
   written once at least 1 problem is finished. Entries are upserted by id (one per session, never duplicated), and only
   the newest 200 are kept. Paper working steps are folded in as paper_done of paper_total (not counted as items).
   Fields (in this order): v, id, player, game_id, mode, started_at, ended_at, items_done, items_total, correct,
   score_pct, hints_used, paper_done, paper_total, mistakes, top_mistakes. Times are ISO with +08:00 (Singapore).
   mode is lesson | practice | test ("Test yourself" check-up, written by MathCheckup through record()). */
var MathHistory=(function(){
"use strict";
var GAME_ID="math-"+(typeof HISTORY_GAME==="string"?HISTORY_GAME:"unknown");
var KEY="mathgames.history.v1", PKEY="mathgames.player", MAX=200, TAGS=["answer","model","working"];
var sess=null, provider=null;
function p2(n){ return (n<10?"0":"")+n; }
function iso(t){ var d=new Date(t+8*3600000); return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())+"T"+p2(d.getUTCHours())+":"+p2(d.getUTCMinutes())+":"+p2(d.getUTCSeconds())+"+08:00"; }
function player(){ var n=""; try{ n=localStorage.getItem(PKEY)||""; }catch(e){} n=String(n).replace(/\s+/g," ").trim().slice(0,24); return n||"Player"; }
function newId(t){ var abc="abcdefghijklmnopqrstuvwxyz0123456789", out="", r=new Uint8Array(6);
  try{ crypto.getRandomValues(r); }catch(e){ for(var j=0;j<6;j++) r[j]=Math.floor(Math.random()*256); }
  for(var i=0;i<6;i++) out+=abc.charAt(r[i]%36); return t.toString(36)+"-"+out; }
function load(){ var a=[]; try{ a=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){} return Array.isArray(a)?a.filter(function(x){ return x && typeof x.id==="string"; }):[]; }
function entry(s){
  var m={}, top=[]; TAGS.forEach(function(k){ if(s.mistakes[k]>0){ m[k]=s.mistakes[k]; top.push(k); } });
  top.sort(function(a,b){ return (m[b]-m[a]) || (TAGS.indexOf(a)-TAGS.indexOf(b)); });
  return {v:1, id:s.id, player:s.player, game_id:GAME_ID, mode:s.mode, started_at:iso(s.t0), ended_at:iso(Date.now()),
    items_done:s.done, items_total:s.total, correct:s.correct, score_pct:s.done?Math.round(100*s.correct/s.done):0,
    hints_used:s.hints, paper_done:s.paperDone, paper_total:s.paperTotal, mistakes:m, top_mistakes:top};
}
// upsert by id, drop any duplicate ids, keep the newest MAX
function save(s){
  if(!s || !(s.done>0)) return false; // opening a game and leaving with nothing finished writes nothing
  var e=entry(s), a=load(), seen={}, out=[];
  for(var i=a.length-1;i>=0;i--){ var x=a[i]; if(seen[x.id] || x.id===e.id) continue; seen[x.id]=1; out.unshift(x); }
  out.push(e); if(out.length>MAX) out=out.slice(out.length-MAX);
  try{ localStorage.setItem(KEY, JSON.stringify(out)); return true; }catch(err){ return false; }
}
function state(){ try{ return provider ? provider() : null; }catch(e){ return null; } }
function begin(){
  var st=state(); sess=null;
  if(!st || !st.open || !(st.remaining>0)) return;
  var t=Date.now();
  sess={id:newId(t), player:player(), mode:st.mode==="practice"?"practice":"lesson", t0:t, done:0, total:st.remaining, correct:0, hints:0, mistakes:{}, paperDone:0, paperTotal:0};
}
window.addEventListener("pagehide", function(){ if(sess){ save(sess); sess=null; } });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden" && sess) save(sess); }); // same id: updated, never duplicated
window.addEventListener("pageshow", function(e){ if(e.persisted && !sess) begin(); });
return {gameId:GAME_ID, key:KEY,
  attach:function(f){ provider=f; },
  // start (or move to) the session for the round on screen; a session left partway with a problem finished is saved first
  restart:function(){ if(sess) save(sess); begin(); },
  miss:function(tag){ if(sess && TAGS.indexOf(tag)>=0) sess.mistakes[tag]=(sess.mistakes[tag]||0)+1; },
  hint:function(){ if(sess) sess.hints++; },
  item:function(ok, roundOver){ if(!sess) return; sess.done++; if(ok) sess.correct++;
    if(roundOver){ var wasLesson=sess.mode==="lesson"; save(sess); sess=null;
      if(wasLesson){ try{ window.dispatchEvent(new Event("mathgames:lessondone")); }catch(e){} } } }, // a finished Lesson round unlocks "Test yourself"
  // a "Test yourself" check-up (mode "test"): same fields and the same upsert as a round
  record:function(o){ return !!o && o.mode==="test" && save(o); },
  // a paper working step was offered (problem 3 from memory, or the "I can do it" choice) / she completed one
  paperOffer:function(){ if(sess) sess.paperTotal++; },
  // once per problem (keyed by the problems finished so far in this session); a Lesson step also earns 1 reward star
  // through the "mathgames:paperdone" event (MathCheckup keeps the key, so it is never counted twice)
  paper:function(){ if(!sess || sess.lastPaper===sess.done) return; sess.lastPaper=sess.done; sess.paperDone++;
    if(sess.mode==="lesson"){ try{ window.dispatchEvent(new CustomEvent("mathgames:paperdone",{detail:{key:sess.id+":"+sess.done}})); }catch(e){} } },
  // a round is on screen and not finished yet (the Home button asks once before leaving)
  // a key for "once per problem" rewards (the session and the problems finished so far), or null outside a round
  key:function(){ return sess ? sess.id+":"+sess.done : null; },
  active:function(){ return !!sess; },
  leave:function(){ if(sess){ save(sess); sess=null; } }};
})();
</script>
<!--HISTORY-END-->

<style>
/* Check-up ("Test yourself") */
html.ckopen, html.ckopen body{overflow:hidden}

/* ===== Check-up ("Test yourself"): 3 exam-style questions after the Lesson. Kept ONLY in this browser's localStorage. =====
   No network code. Nothing is timed, no hints during the test, never a gate: it is always optional.
   Stars: right first try = 2, right on a new try = 1, finishing = 3 more, all 3 right first try = the game's Test badge.
   Writing the working on paper also earns 1 star, once per question ('I wrote my working' on questions 2 and 3) and once per
   Lesson paper step (the "mathgames:paperdone" event from MathHistory.paper(), keyed by session + problem, never counted twice).
   Stars never go down and hints never cost stars. Badges and the end screen say what she can do now (CHECKUP_MASTERY, one
   sentence per game); the star total is shown small, as information, not as a price. Showing a grown-up is optional and
   never needed to carry on. Results also go to the practice history as mode "test" (schema v1). */
var MathCheckup=(function(){
"use strict";
var SLUG=(typeof CHECKUP_GAME==="string")?CHECKUP_GAME:"", BK=CHECKUP_BANK[SLUG], QS=BK.qs, LS=BK.lessons;
var TITLE=(typeof CHECKUP_TITLE==="string")?CHECKUP_TITLE:document.title;
var RKEY="mathgames.rewards.v1", UKEY="mathgames.checkup.unlocked.v1", RUNKEY="mathgames.checkup.luna.run."+SLUG, PKEY="mathgames.player", HKEY="mathgames.history.v1";
var STAR_FIRST=2, STAR_RETRY=1, STAR_FINISH=3, STAR_PAPER=1;
var MASTERY=(typeof CHECKUP_MASTERY==="object" && CHECKUP_MASTERY)?CHECKUP_MASTERY:{}, CAN=MASTERY[SLUG]||("You can now solve "+TITLE+" problems.");
// Every speakable fixed-bank line uses recorded Luna; player names are display-only.
var SAY={
  intro:"Test yourself. Three questions, like in your exam.",
  paper:"Write your working and draw the model on your paper. Then type your answer.",
  unit:"Choose the unit too.",
  type:"Type your answer on the number pad.",
  right:"Yes, that's right. Now check your paper against the worked solution.",
  rightRetry:"Yes, that's right this time. Check your paper against the worked solution.",
  notYet:"Not yet.",
  generic:"Read the question again, then check your working one line at a time. What does the question ask for?",
  lesson:"Go back to the lesson to see this step again. Then come back to your test.",
  retry:"Here is a new one like it, with new numbers.",
  sol:"Here is the worked solution. Read why each line is there.",
  back:"Welcome back to your test.",
  end:"You finished the check-up. Every question is done.",
  badge:"All three were right on the first try. This badge is yours.",
  goal:"All three right on the first try earns this game's badge.",
  money:"Write the cents with two digits, like this: 4 dollars 50 cents is 4.50.",
  time:"Type the time with the minutes last, like 4 1 5 for 4:15. Then choose am or pm."
};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function jget(k,d){ try{ var v=JSON.parse(get(k)||"null"); return v==null?d:v; }catch(e){ return d; } }
function host(){ return window.MathHost||null; }
function say(){ var h=host(), a=Array.prototype.slice.call(arguments).filter(Boolean); if(h && h.say && a.length) try{ h.say.apply(null,a); }catch(e){} }
function player(){ var n=String(get(PKEY)||"").replace(/\s+/g," ").trim().slice(0,24); return n||"Player"; }
function p2(n){ return (n<10?"0":"")+n; }
function iso(t){ var d=new Date(t+8*3600000); return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())+"T"+p2(d.getUTCHours())+":"+p2(d.getUTCMinutes())+":"+p2(d.getUTCSeconds())+"+08:00"; }
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dateLabel(t){ var d=new Date(t+8*3600000); return DAYS[d.getUTCDay()]+" "+d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function newId(t){ var abc="abcdefghijklmnopqrstuvwxyz0123456789", out=""; for(var i=0;i<6;i++) out+=abc.charAt(Math.floor(Math.random()*36)); return "t"+t.toString(36)+"-"+out; }

/* ---------- unlock: after a Lesson round (or an earlier finished Lesson in the history) ---------- */
function unlocked(){
  var u=jget(UKEY,{}); if(u && u[SLUG]) return true;
  var h=jget(HKEY,[]); if(!Array.isArray(h)) return false;
  return h.some(function(x){ return x && x.game_id==="math-"+SLUG && x.mode==="lesson" && x.items_done>0 && x.items_done>=x.items_total; });
}
function unlock(){ var u=jget(UKEY,{}); if(!u || typeof u!=="object") u={}; if(!u[SLUG]){ u[SLUG]=iso(Date.now()); set(UKEY,JSON.stringify(u)); } drawBtn(); }

/* ---------- reward points (per player, never go down) ---------- */
function rewards(){ var r=jget(RKEY,null); if(!r || typeof r!=="object" || !r.players || typeof r.players!=="object") r={v:1, players:{}};
  // same key and shape as before; older entries get the new optional field (paper) and keep every star they had
  for(var n in r.players){ var P=r.players[n]; if(!P || typeof P!=="object"){ delete r.players[n]; continue; }
    P.stars=Math.max(0,Math.round(+P.stars||0)); if(!P.badges || typeof P.badges!=="object") P.badges={}; if(!Array.isArray(P.tests)) P.tests=[]; if(!Array.isArray(P.paper)) P.paper=[]; }
  r.v=1; return r; }
function playerRec(r, who){ return r.players[who]||(r.players[who]={stars:0, badges:{}, tests:[], paper:[]}); }
function addStars(n, why){
  if(!(n>0)) return; var r=rewards(), P=playerRec(r, player());
  P.stars=(+P.stars||0)+n; set(RKEY,JSON.stringify(r));
}
function addBadge(){
  var r=rewards(), P=playerRec(r, player()), b=P.badges[SLUG];
  if(!b) P.badges[SLUG]={first:iso(Date.now()), count:1}; else b.count=(+b.count||0)+1;
  set(RKEY,JSON.stringify(r));
}
function logTest(run){
  var r=rewards(), P=playerRec(r, run.player);
  P.tests=(P.tests||[]).filter(function(t){ return t.id!==run.id; });
  P.tests.push({id:run.id, game:SLUG, at:iso(Date.now()), stars:run.stars, paper:paperCount(run), first:firstCount(run), done:doneCount(run), total:QS.length, badge:!!run.badge});
  if(P.tests.length>50) P.tests=P.tests.slice(P.tests.length-50);
  set(RKEY,JSON.stringify(r));
}
/* a Lesson paper working step (key = session id + problem): 1 star, once */
function paperStar(key){
  key=String(key||""); if(!key) return false; var r=rewards(), P=playerRec(r, player());
  if(P.paper.indexOf(key)>=0) return false;
  P.paper.push(key); if(P.paper.length>200) P.paper=P.paper.slice(P.paper.length-200);
  P.stars=(+P.stars||0)+STAR_PAPER; set(RKEY,JSON.stringify(r)); return true;
}
function myStars(){ var P=rewards().players[player()]; return P?(+P.stars||0):0; }

/* ---------- the run (one check-up), saved so she can visit the lesson and come back ---------- */
var run=null, open=false;
function fresh(){
  var t=Date.now();
  return {v:1, id:newId(t), player:player(), t0:t, slot:0, attempt:1, p:CK.gen(QS[0], true), phase:"intro", typed:"", unit:"", res:QS.map(function(){ return {first:null, got:false, tries:0, stars:0, paper:false}; }),
    stars:0, wrongs:0, diag:null, sol:false, bonus:0, badge:false, saved:false, done:false};
}
function load(){ var r=jget(RUNKEY,null); if(r && r.v===1 && r.p && r.res && r.res.length===QS.length && !r.done && r.player===player()) return r; return null; }
function save(){ if(run) set(RUNKEY,JSON.stringify(run)); }
function firstCount(r){ return r.res.filter(function(x){ return x.first===true; }).length; }
function doneCount(r){ return r.res.filter(function(x){ return x.got || x.tries>0; }).length; }
function paperCount(r){ return r.res.filter(function(x){ return x.paper; }).length; }
function finishedSlots(r){ return r.res.filter(function(x){ return x.got || x.skipped; }).length; }
/* practice history entry, mode "test" (same schema v1 as Lesson and Practice) */
function history(final){
  if(!run || !window.MathHistory || !MathHistory.record) return;
  var n=finishedSlots(run); if(!(n>0)) return;
  var paperDone=0, paperTotal=0; QS.forEach(function(q,i){ if(q.kind==="work"){ paperTotal++; if(run.res[i].got) paperDone++; } });
  MathHistory.record({id:run.id, player:run.player, mode:"test", t0:run.t0, done:n, total:QS.length, correct:firstCount(run), hints:0,
    paperDone:paperDone, paperTotal:paperTotal, mistakes:{answer:run.wrongs}});
}

/* ---------- answers ---------- */
function q(){ return QS[run.slot]; }
function units(){ return q().units||null; }
function needsUnit(){ if(run.p.type==="two") return false; return !!units() || run.p.type==="time"; }
function unitChoices(){ return run.p.type==="time" ? ["am","pm"] : (units()||[]); }
function showTyped(){
  var t=run.typed, p=run.p; if(t==="") return "";
  if(p.type==="time"){ return t.length>2 ? t.slice(0,t.length-2)+":"+t.slice(-2) : t; }
  if(p.type==="two" && t.indexOf(".")>=0){ var a=t.split("."); return a[0]+" "+p.big+(a[1]!==""?" "+a[1]+" "+p.small:""); }
  return t;
}
// returns {v:value} or {msg:format help}
function parse(){
  var t=run.typed, p=run.p;
  if(t==="") return {msg:SAY.type};
  if(p.type==="two"){ var w=/^(\d+)\.(\d{1,3})$/.exec(t);
    if(/^\d+$/.test(t) && +t===p.answer) return {v:-1, a:-1, b:-1, bs:"", whole:true}; // the right amount, all in the small unit: marked, with a pointer
    if(/^\d+$/.test(t)) return {msg:"The question asks for "+p.big+" and "+p.small+". Type the "+p.big+", tap the "+p.big+" key, then type the "+p.small+". 1000 "+p.small+" make 1 "+p.big+"."};
    if(/\.$/.test(t)) return {msg:"Now type the "+p.small+" after the "+p.big+"."};
    if(!w) return {msg:"After the "+p.big+", there are at most 3 digits for the "+p.small+". 1000 "+p.small+" make 1 "+p.big+"."};
    return {v:(+w[1])*1000+(+w[2]), a:+w[1], b:+w[2], bs:w[2]}; }
  if(p.type==="money"){ var m=/^(\d+)(?:\.(\d\d))?$/.exec(t); if(!m) return {msg:SAY.money}; return {v:(+m[1])*100+(m[2]?+m[2]:0)}; }
  if(p.type==="time"){ if(!/^\d{3,4}$/.test(t)) return {msg:SAY.time}; var h=+t.slice(0,t.length-2), mm=+t.slice(-2); if(h<1||h>12||mm>59) return {msg:SAY.time};
    if(!run.unit) return {msg:SAY.unit}; var hh=h%12+(run.unit==="pm"?12:0); return {v:hh*60+mm, raw:(h%12)*60+mm}; }
  if(!/^\d+$/.test(t)) return {msg:SAY.type};
  if(needsUnit() && !run.unit) return {msg:SAY.unit};
  return {v:+t};
}
function check(){
  var r=parse(), p=run.p, Q=q(), R=run.res[run.slot];
  if(r.msg){ run.fb={cls:"try", msg:r.msg}; draw(); say(r.msg); return; }
  R.tries++;
  var numberRight = p.type==="time" ? (r.raw===p.answer%720) : (r.v===p.answer);
  var unitRight = p.type==="time" ? (r.v===p.answer) : (!units() || run.unit===p.unit);
  if(numberRight && unitRight){
    var first=(run.attempt===1 && R.tries===1);
    if(R.first===null) R.first=first;
    var s=first?STAR_FIRST:STAR_RETRY; if(!R.got){ R.got=true; R.stars=s; run.stars+=s; addStars(s); }
    run.phase="right"; run.sol=true; run.fb=null; save(); history(false); draw();
    say(praiseLine(), first?SAY.right:SAY.rightRetry); return;
  }
  if(R.first===null) R.first=false;
  run.wrongs++; if(window.MathHistory && MathHistory.miss) {}
  var d=null;
  if(numberRight && !unitRight){ d = p.type==="time" ? (Q.diag.ampm||null) : (Q.unitMsg||null); }
  // two units (kg and g, \u2113 and m\u2113): the right digits split the wrong way -> point to the unit-change line
  if(!d && p.type==="two" && r.whole && Q.diag.whole) d=Q.diag.whole;
  if(!d && p.type==="two" && Q.diag.split){ var A=Math.floor(p.answer/1000), Rr=p.answer%1000;
    if(r.a*100+r.b===p.answer || r.a*10+r.b===p.answer || (String(r.a)+r.bs)===String(p.answer) || (r.a===Rr && r.b===A) || (r.a===A && r.b*10===Rr) || (r.a===A && r.b===Rr*10 && r.b<1000)) d=Q.diag.split; }
  if(!d){ var v=(p.type==="time")?r.v:r.v; for(var i=0;i<p.wrongs.length;i++){ var w=p.wrongs[i]; if(w[0]===v || (p.type==="time" && w[0]%720===r.raw && !Q.diag.ampm)){ d=Q.diag[w[1]]; break; } } }
  if(!d) d=[SAY.generic, Q.go];
  run.diag={msg:d[0], go:d[1]}; run.phase="wrong"; run.sol=false; run.fb=null; save(); history(false); draw();
  say(SAY.notYet, d[0]);
}
function ansShown(){ return CK.ansText(run.p)+(run.p.unit && run.p.type!=="time" && run.p.type!=="money" && run.p.type!=="two" ? " "+run.p.unit : ""); }
// specific, true praise: name what was right (the step or the answer, never the child)
function praiseLine(){ var p=run.p; return "Yes! "+CK.ansText(p)+(p.unit&&p.type!=="time"&&p.type!=="money"&&p.type!=="two"?" "+p.unit:"")+" answers the question."; }

/* ---------- screens ---------- */
function ov(){ var o=$("ckOverlay"); if(!o){ o=document.createElement("div"); o.id="ckOverlay"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true"); o.setAttribute("aria-label","Test yourself"); document.body.appendChild(o); } return o; }
function starsTxt(n){ var s=""; for(var i=0;i<n;i++) s+="⭐"; return s||"–"; }
function head(){
  var h='<div class="ckhead"><span class="cktitle">📝 Test yourself · '+esc(TITLE)+'</span><span class="ckpts" id="ckPts">⭐ '+run.stars+' this test</span>'+
    '<button class="ckq" id="ckRead" type="button">🔊 Read it to me</button><button class="ckq" id="ckClose" type="button">✕ Close</button></div>';
  h+='<div class="ckdots">'+QS.map(function(x,i){ var r=run.res[i], c=i===run.slot&&run.phase!=="end"&&run.phase!=="intro"?"cur":(r.got?(r.first?"first":"got"):(r.skipped?"skip":"")); return '<span class="'+c+'">'+(r.got?(r.first?"⭐⭐":"⭐"):(i+1))+'</span>'; }).join("")+'</div>';
  return h;
}
function paperQ(){
  var Q=q(), p=run.p;
  var h='<div class="ckpaper"><div class="ckqhead"><b>Question '+(run.slot+1)+' of '+QS.length+'</b>'+(run.attempt>1?' <span class="cknew">New numbers</span>':'')+'<span class="ckmarks">['+Q.marks+' marks]</span></div>';
  h+='<p class="cktext" id="ckText"><span class="cknum">'+(run.slot+1)+'.</span> '+esc(p.text)+'</p>';
  if(Q.kind==="work"){ var R=run.res[run.slot];
    h+='<div class="ckwork">✏️ Show your working clearly. Write your working and draw the model on your paper.</div>';
    // optional: ticking it earns 1 star for the working, once per question (a new try at the same question keeps the tick)
    h+=R.paper ? '<div class="ckwrote done" id="ckWroteDone">✅ I wrote my working <span class="ckearn">+⭐ for your working</span></div>'
               : '<div class="ckwrote"><button type="button" class="ckbtn ghost" id="ckWrote">☐ I wrote my working</button><span class="ckmuted"> ⭐ for writing your working on paper</span></div>';
  }
  return h;
}
function ansLine(active){
  var p=run.p, ch=unitChoices();
  var pre = p.type==="money" ? '<span class="ckpre">$</span>' : '';
  var post = (!needsUnit() && p.unit) ? '<span class="ckpost">'+esc(p.unit)+'</span>' : '';
  var h='<div class="ckans"><span class="ckanslab">Ans:</span>'+pre+'<span class="ckbox" id="ckBox">'+(esc(showTyped())||"&nbsp;")+'</span>'+post;
  if(needsUnit()) h+='<span class="ckunits" role="group" aria-label="unit">'+ch.map(function(u){ return '<button type="button" class="ckunit'+(run.unit===u?' on':'')+'" data-u="'+esc(u)+'"'+(active?'':' disabled')+'>'+esc(u)+'</button>'; }).join("")+'</span>';
  h+='</div>';
  return h;
}
function pad(){
  var dot=run.p.type==="money", sep=run.p.type==="two";
  return '<div class="ckpad">'+[1,2,3,4,5,6,7,8,9].map(function(k){ return '<button type="button" data-ck="'+k+'">'+k+'</button>'; }).join("")+
    (sep?'<button type="button" data-ck="." class="sepkey" aria-label="'+esc(run.p.big)+'">'+esc(run.p.big)+'</button>':dot?'<button type="button" data-ck="." aria-label="point">.</button>':'<button type="button" data-ck="clr">C</button>')+'<button type="button" data-ck="0">0</button><button type="button" data-ck="del" aria-label="delete">⌫</button></div>';
}
function solution(){
  var p=run.p, h='<div class="cksol" id="ckSol"><h3>Worked solution</h3><table class="cklines"><thead><tr><th></th><th>Working</th><th>Why this line?</th></tr></thead><tbody>';
  p.lines.forEach(function(L,i){ h+='<tr><td class="ckln">'+(i+1)+'</td><td><div class="ckeq">'+(L[0]?esc(L[0]):'')+'</div><div class="ckst">'+esc(L[1])+'</div></td><td class="ckwhy">'+esc(L[2])+'</td></tr>'; });
  h+='<tr class="ckansrow"><td class="ckln">Ans</td><td><div class="ckst"><b>'+esc(p.ans)+'</b></div></td><td class="ckwhy">The answer sentence uses words from the question and the unit, so the marker knows what your number means.</td></tr>';
  h+='<tr><td class="ckln">Check</td><td><div class="ckeq">'+esc(p.check[0])+' ✓</div></td><td class="ckwhy">'+esc(p.check[1])+'</td></tr>';
  h+='</tbody></table></div>';
  return h;
}
function wrote(){
  var Q=q(), R=run.res[run.slot]; if(Q.kind!=="work" || R.paper) return;
  R.paper=true; run.stars+=STAR_PAPER; addStars(STAR_PAPER); save(); draw();
}
function mastery(){ return '<p class="ckcan" id="ckMastery">🏅 '+esc(CAN)+'</p>'; }
function draw(){
  var o=ov(), h=head();
  if(run.phase==="intro"){
    h+='<div class="ckpaper ckintro"><div class="ckbig">📝</div><h2>Test yourself</h2><p>'+esc(SAY.intro)+' There are no hints, and you can take as long as you need.</p>'+
      '<p>Question 1 is a short question. For questions 2 and 3, '+esc(SAY.paper.charAt(0).toLowerCase()+SAY.paper.slice(1))+'</p>'+
      '<ul class="ckrules"><li>⭐⭐ for each question right on the first try</li><li>⭐ for a question right on a new try</li><li>⭐ for writing your working on paper (questions 2 and 3)</li><li>+'+STAR_FINISH+' ⭐ for finishing the test</li><li>🏅 the Test badge for all 3 right on the first try</li></ul>'+
      '<div class="ckrow"><button type="button" class="ckbtn green" id="ckStart">Start the test ▶</button><button type="button" class="ckbtn ghost" id="ckLater">Not now</button></div></div>';
  } else if(run.phase==="q"){
    h+=paperQ()+ansLine(true)+pad()+'<div class="ckfb'+(run.fb?' '+run.fb.cls:'')+'" id="ckFb">'+(run.fb?esc(run.fb.msg):'')+'</div>'+
      '<div class="ckrow"><button type="button" class="ckbtn green" id="ckCheck">Check ✓</button></div></div>';
  } else if(run.phase==="right"){
    var R=run.res[run.slot];
    h+=paperQ()+ansLine(false)+'<div class="ckfb ok" id="ckFb">✅ Yes! <b>'+esc(ansShown())+'</b> answers the question. <span class="ckearn">+'+starsTxt(R.stars)+'</span></div>'+solution()+
      '<div class="ckrow"><button type="button" class="ckbtn green" id="ckNext">'+(run.slot<QS.length-1?'Next question ➡️':'See my result ➡️')+'</button></div></div>';
  } else if(run.phase==="wrong"){
    var L=LS[run.diag.go]||LS[q().go];
    h+=paperQ()+ansLine(false)+'<div class="ckfb try" id="ckFb"><b>Not yet.</b> '+esc(run.diag.msg)+'</div>'+
      '<div class="cklesson"><button type="button" class="ckbtn blue" id="ckLesson">📘 Go back to the lesson</button><span class="ckll" id="ckLessonLabel">'+esc(L.label)+'</span></div>'+
      '<div class="ckrow"><button type="button" class="ckbtn green" id="ckRetry">🔁 Try a new one like it</button>'+
      (run.sol?'':'<button type="button" class="ckbtn ghost" id="ckShowSol">👀 See the worked solution</button>')+
      '<button type="button" class="ckbtn ghost" id="ckSkip">'+(run.slot<QS.length-1?'Next question ➡️':'Finish the test ➡️')+'</button></div>'+
      (run.sol?solution():'')+'</div>';
  } else if(run.phase==="end"){
    // what she can do now comes first; the stars are small, as information; showing a grown-up is optional
    var fc=firstCount(run), pc=paperCount(run);
    h+='<div class="ckpaper ckend"><div class="ckbig">'+(run.badge?'🏅':'🌟')+'</div><h2>'+esc(SAY.end)+'</h2>'+
      (run.badge?'<p class="ckbadge" id="ckBadgeMsg">'+esc(SAY.badge)+'</p>'+mastery()
                :'<p class="ckres">Right on the first try: <b>'+fc+' of '+QS.length+'</b></p><p class="ckgoal" id="ckGoal">'+esc(SAY.goal)+' <span class="ckgoalcan">“'+esc(CAN)+'”</span></p>')+
      '<p class="ckstars" id="ckStarsLine"><span id="ckEndStars">⭐ '+run.stars+'</span> from this test'+
        ' (+'+run.bonus+' for finishing'+(pc?', +'+(pc*STAR_PAPER)+' for your working':'')+') · <span id="ckTotal">⭐ '+myStars()+'</span> in all</p>'+
      '<div class="ckrow"><button type="button" class="ckbtn green" id="ckDone">Close</button><button type="button" class="ckbtn ghost" id="ckAgain">Test again with new numbers</button></div>'+
      '<p class="ckshow" id="ckShowLine"><button type="button" class="cklink" id="ckShow">Show a grown-up, if you like</button></p></div>';
  }
  o.innerHTML=h; o.hidden=false; document.documentElement.classList.add("ckopen"); open=true;
  bind();
}
function bind(){
  var o=ov();
  if($("ckClose")) $("ckClose").onclick=close;
  if($("ckRead")) $("ckRead").onclick=readAloud;
  if($("ckStart")) $("ckStart").onclick=function(){ run.phase="q"; save(); draw(); readQ(); };
  if($("ckLater")) $("ckLater").onclick=close;
  o.querySelectorAll("[data-ck]").forEach(function(b){ b.onclick=function(){ var k=b.getAttribute("data-ck"), lim=(run.p.type==="money"||run.p.type==="two")?7:(run.p.type==="time"?4:5);
    if(k==="del") run.typed=run.typed.slice(0,-1); else if(k==="clr") run.typed="";
    else if(k==="."){ if(run.typed.indexOf(".")<0 && run.typed.length<lim) run.typed=(run.typed===""?"0":run.typed)+"."; }
    else if(run.typed.length<lim) run.typed=(run.typed==="0"?"":run.typed)+k;
    $("ckBox").innerHTML=esc(showTyped())||"&nbsp;"; save(); }; });
  o.querySelectorAll("[data-u]").forEach(function(b){ b.onclick=function(){ run.unit=b.getAttribute("data-u"); o.querySelectorAll("[data-u]").forEach(function(x){ x.classList.toggle("on", x===b); }); save(); }; });
  if($("ckCheck")) $("ckCheck").onclick=check;
  if($("ckNext")) $("ckNext").onclick=next;
  if($("ckSkip")) $("ckSkip").onclick=function(){ run.res[run.slot].skipped=true; next(); };
  if($("ckRetry")) $("ckRetry").onclick=function(){ run.p=CK.gen(q(), false, run.p.text); run.attempt++; run.typed=""; run.unit=""; run.phase="q"; run.diag=null; run.sol=false; save(); draw(); say(SAY.retry, run.p.text); };
  if($("ckShowSol")) $("ckShowSol").onclick=function(){ run.sol=true; save(); draw(); var s=$("ckSol"); if(s && s.scrollIntoView) s.scrollIntoView({block:"start"}); say.apply(null,[SAY.sol].concat(solutionLines(run.p))); };
  if($("ckLesson")) $("ckLesson").onclick=goLesson;
  if($("ckShow")) $("ckShow").onclick=function(){ showView(); };
  if($("ckWrote")) $("ckWrote").onclick=wrote;
  if($("ckDone")) $("ckDone").onclick=close;
  if($("ckAgain")) $("ckAgain").onclick=function(){ run=fresh(); run.phase="q"; save(); draw(); readQ(); };
}
function readQ(){ var Q=q(); say(run.p.text, Q.kind==="work"?SAY.paper:null); }
function readAloud(){
  if(run.phase==="q") readQ();
  else if(run.phase==="wrong") say(SAY.notYet, run.diag.msg);
  else if(run.phase==="right") say.apply(null,[praiseLine(),SAY.sol].concat(solutionLines(run.p)));
  else if(run.phase==="end") say(SAY.end, run.badge?SAY.badge:null, run.badge?CAN:null);
  else say(SAY.intro);
}
function next(){
  if(run.slot<QS.length-1){ run.slot++; run.attempt=1; run.p=CK.gen(QS[run.slot], true); run.typed=""; run.unit=""; run.phase="q"; run.diag=null; run.sol=false; save(); draw(); readQ(); return; }
  // the end: bonus for finishing, the badge for all right first try
  run.bonus=STAR_FINISH; run.stars+=STAR_FINISH; addStars(STAR_FINISH);
  if(firstCount(run)===QS.length){ run.badge=true; addBadge(); }
  run.phase="end"; run.done=true; logTest(run); history(true); set(RUNKEY,""); try{ localStorage.removeItem(RUNKEY); }catch(e){}
  draw(); say(SAY.end, run.badge?SAY.badge:null, run.badge?CAN:null);
}
function close(){ var o=$("ckOverlay"); if(o){ o.hidden=true; o.innerHTML=""; } document.documentElement.classList.remove("ckopen"); open=false; var h=host(); if(h && h.stop) try{ h.stop(); }catch(e){} if(run && !run.done) save(); }

shared/luna-82368dd5540cedbc3b9f.mp3", "Here is the model working. Check your paper line by line. Tap a line to see where it comes from on the bars. Tick each box when it is on your paper.": "../audio-shared/luna-76a2c2b427baaf0fbb0c.mp3", "Now write it on your paper. Copy each line, then tick each box when it is on your paper.": "../audio-shared/luna-2acceb7492480414375d.mp3", "All ticked. Every line is on your paper.": "../audio-shared/luna-a66194999675d8c5dffe.mp3", "Where do we use this in real life? You and your brother both have 10 sweets, and you give him 3. Now you have 7 and he has 13, so he is 6 ahead, not 3! Moving 3 changes the gap by 6: one side loses 3, the other gains 3.": "../audio-shared/luna-b2e4a21cb587bdcf681c.mp3", "Where do we use this in real life? The Lions lead the Tigers 3 to 2, but the referee says one Lions goal really belongs to the Tigers. Now it is 2 to 3: only 1 goal moved, but the gap changed by 2. Moving 1 changes the gap by 2: one side loses 1, the other gains 1.": "../audio-shared/luna-d64a3c588897297915a7.mp3", "Where do we use this in real life? Shelf A has 20 books and Shelf B has 12, a gap of 8. Move just half the gap, 4 books, and both shelves have 16. To make two groups equal, move half the gap.": "../audio-shared/luna-b35551126f60b2114cd7.mp3", "Where do we use this in real life? The red and blue piggy banks both have 12 coins. Move 5 coins from red to blue and it is 7 and 17, so blue has 10 more: 5 lost plus 5 gained. Moving 5 changes the gap by 10: one side loses 5, the other gains 5.": "../audio-shared/luna-396a95be9bdeb4f894ed.mp3", "Where do we use this in real life? On the MRT, Carriage 1 has 40 passengers and Carriage 2 has 30, a gap of 10. Only half the gap, 5 people, need to walk to the next carriage, and then both have 35. To make two groups equal, move half the gap.": "../audio-shared/luna-03637dcd1bf86ff4d4ac.mp3", "Where do we use this in real life? For the class party, ice cream has 16 votes and bubble tea has 14. When 2 children switch to bubble tea it is 14 to 16, because each switch changes the gap by 2. Moving 2 changes the gap by 4: one side loses 2, the other gains 2.": "../audio-shared/luna-333f4d1dd3a8fd4ecd00.mp3", "Where do we use this in real life? The red and blue tug-of-war teams both have 6 players. If 1 player switches to blue, it is 5 against 7, so blue has 2 more, not 1! Moving 1 changes the gap by 2: one side loses 1, the other gains 1.": "../audio-shared/luna-163daf1a784c675a0791.mp3", "Where do we use this in real life? Table A has 9 chairs and Table B has 5. Move 3 chairs over and it is 6 and 8, so the gap changed by 6, twice the 3 you moved. Moving 3 changes the gap by 6: one side loses 3, the other gains 3.": "../audio-shared/luna-89f8bcadf5b3f35d66f0.mp3", "You finished the round and got all 5 stars! Your first guesses were right 0 out of 5 times.": "../audio-shared/luna-22fa891493fb0fd88fe2.mp3", "You finished the round and got all 5 stars! Your first guesses were right 1 out of 5 times.": "../audio-shared/luna-c0910ce75fc3bb621c7e.mp3", "You finished the round and got all 5 stars! Your first guesses were right 2 out of 5 times.": "../audio-shared/luna-86f94bf1e0cc09222e26.mp3", "You finished the round and got all 5 stars! Your first guesses were right 3 out of 5 times.": "../audio-shared/luna-1010375913eac46ef55e.mp3", "You finished the round and got all 5 stars! Your first guesses were right 4 out of 5 times.": "../audio-shared/luna-da663b0bf479518f42c1.mp3", "You finished the round and got all 5 stars! Your first guesses were right 5 out of 5 times.": "../audio-shared/luna-f1332b6135093294d5f9.mp3", "Hello! I'm your maths tutor, and I'll help you, step by step.": "../audio-shared/luna-a8d18e425a01c55d9de4.mp3", "Hello! Welcome back.": "../audio-shared/luna-be5698531c562a96e09c.mp3", "First, tap who has more, or tap Same.": "../audio-shared/luna-ec75f2873623a013ad41.mp3", "Now type how many more on the number pad.": "../audio-shared/luna-a2d1bc s 50 cents is 4.50.": "../audio-shared/luna-78afde4392ecccc0e0ce.mp3", "Type the time with the minutes last, like 4 1 5 for 4:15. Then choose am or pm.": "../audio-shared/luna-3c6e60c989a4d339fdaa.mp3", "You can now solve moving-between-groups problems: when some move from one group to the other, both bars change.": "../audio-shared/luna-84c86b741a92aacee359.mp3", "Moving takes some away from Box A AND gives them to Box B. The gap changes on both sides.": "../audio-shared/luna-b31f44e59659c523cd33.mp3", "The gap does change when some are moved. Watch what happens to both bars.": "../audio-shared/luna-52781df1421c3bacd8f1.mp3", "Box A gives some away, so its bar gets shorter. Is the gap bigger or smaller now?": "../audio-shared/luna-78d8a847af1bab97c2fd.mp3", "Box A has 46 more marbles than Box B. 9 marbles are moved from Box A to Box B. How many more marbles does Box A have than Box B now?": "../audio-shared/luna-7997db2f24bfadb7d28d.mp3", "Yes! 28 more marbles answers the question.": "../audio-shared/luna-11ae23ae4b6123720b9d.mp3", "9 + 9 = 18. The gap gets smaller by 18. Why this line? Box A loses 9 and Box B gains 9, so the gap closes from both sides.": "../audio-shared/luna-2fc65e2c80c2c21da0e6.mp3", "46 minus 18 = 28. Box A has 28 more marbles than Box B now. Why this line? The old gap take away what closed.": "../audio-shared/luna-4c282e0fe5570cfd6be4.mp3", "Box A has 28 more marbles than Box B now.": "../audio-shared/luna-0e9de5fd64dfeb50a0b9.mp3", "Check. 28 + 9 + 9 = 46. Put the 9 back on each side and the gap is 46 again.": "../audio-shared/luna-ac19a1b2f6475b5640a4.mp3", "Box A has 26 more beads than Box B. 4 beads are moved from Box A to Box B. How many more beads does Box A have than Box B now?": "../audio-shared/luna-b613f9ba9e68964cd0aa.mp3", "Yes! 18 more beads answers the question.": "../audio-shared/luna-1e29cbb15f804c926ecc.mp3", "4 + 4 = 8. The gap gets smaller by 8. Why this line? Box A loses 4 and Box B gains 4, so the gap closes from both sides.": "../audio-shared/luna-cbef95da1b1f9c0ac6c1.mp3", "26 minus 8 = 18. Box A has 18 more beads than Box B now. Why this line? The old gap take away what closed.": "../audio-shared/luna-bce13794c280c9ea0194.mp3", "Box A has 18 more beads than Box B now.": "../audio-shared/luna-6a8013351e6f8d2d24ae.mp3", "Check. 18 + 4 + 4 = 26. Put the 4 back on each side and the gap is 26 again.": "../audio-shared/luna-795c507f2e834067fe1d.mp3", "Box A has 62 more marbles than Box B. 11 marbles are moved from Box A to Box B. How many more marbles does Box A have than Box B now?": "../audio-shared/luna-68acf96ccc229d3e6282.mp3", "Yes! 40 more marbles answers the question.": "../audio-shared/luna-7fc15a90a31df31141b2.mp3", "11 + 11 = 22. The gap gets smaller by 22. Why this line? Box A loses 11 and Box B gains 11, so the gap closes from both sides.": "../audio-shared/luna-718f84a5fb56245c1ae9.mp3", "62 minus 22 = 40. Box A has 40 more marbles than Box B now. Why this line? The old gap take away what closed.": "../audio-shared/luna-c12ac4dcc328afdd402f.mp3", "Box A has 40 more marbles than Box B now.": "../audio-shared/luna-95199204b50a2a087de2.mp3", "Check. 40 + 11 + 11 = 62. Put the 11 back on each side and the gap is 62 again.": "../audio-shared/luna-835e0d61d627e69d287b.mp3", "Box A has 40 more crayons than Box B. 9 crayons are moved from Box A to Box B. How many more crayons does Box A have than Box B now?": "../audio-shared/luna-8e6f574704472debc81b.mp3", "Yes! 22 more crayons answers the question.": "../audio-shared/luna-6b794b6629d645ef4e42.mp3", "40 minus 18 = 22. Box A has 22 more crayons than Box B now. Why this line? The old gap take away what closed.": "../audio-shared/luna-06faab5a69eb83b92ba8.mp3", "Box A has 22 more crayons than Box B now.": "../audio-shared/luna-45dcc9f9b00f583f58fe.mp3", "Check. 22 + 9 + 9 = 40. Put the 9 back on each side and the gap is 40 again.": "../audio-shared/luna-c0117d01204c75d2f7da.mp3", "Box A has 44 more crayons than Box B. 6 crayons are // and later lines reuse the same element. A missing or broken clip is skipped silently.
var Clips = (function(){
  var el = null, queue = [], last = [], started = false, playing = false, idleCbs = [], cache = {};
  function src(id){ return "audio/"+id+".mp3"; }
  function ensure(){
    if(el) return el;
    el = new Audio(); el.preload = "auto";
    el.addEventListener("ended", function(){ advance(); });
    el.addEventListener("error", function(){ if(playing) advance(); });
    return el;
  }
  function idle(){ playing = false; var cbs = idleCbs; idleCbs = []; cbs.forEach(function(f){ try{ f(); }catch(e){} }); }
  function advance(){
    if(!queue.length){ idle(); return; }
    var id = queue.shift(); ensure(); playing = true;
    try{
      el.src = src(id);
      var p = el.play();
      if(p && p.catch) p.catch(function(err){ if(err && err.name==="NotAllowedError"){ queue = []; idle(); } });
    }catch(e){ advance(); }
  }
  function stop(){ queue = []; if(el){ try{ el.pause(); }catch(e){} } idle(); }
  function norm(ids){ return (ids||[]).filter(Boolean); }
  function play(ids){ ids = norm(ids); if(!ids.length) return; last = ids.slice(); if(!started || Voice.muted) return; stop(); queue = ids.slice(); advance(); }
  function enqueue(ids){ ids = norm(ids); if(!ids.length) return; if(!playing){ play(ids); return; } last = ids.slice(); queue = queue.concat(ids); }
  return {
    play: play, enqueue: enqueue, stop: stop,
    again: function(){ if(last.length) play(last.slice()); },
    whenIdle: function(f){ if(playing && started && !Voice.muted) idleCbs.push(f); else f(); },
    preload: function(ids){ var keep = {}; norm(ids).forEach(function(id){ if(cache[id]) keep[id] = cache[id]; else { var a = new Audio(); a.preload = "auto"; a.src = src(id); keep[id] = a; } }); cache = keep; },
    unlock: function(ids){ started = true; ensure(); ids = norm(ids); if(ids.length){ last = ids.slice(); if(!Voice.muted){ stop(); queue = ids.slice(); advance(); } } },
    setLast: function(ids){ last = norm(ids); },
    get started(){ return started; }, get playing(){ return playing; },
    get lastIds(){ return last.slice(); }, get preloaded(){ return Object.keys(cache); }
  };

/* ---------- animation ---------- */
var SPEED=1; // tests can raise this
function tween(from,to,ms,done){
  var t0=null; ms=ms/SPEED;
  function step(ts){
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/ms);
    var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    var v=from+(to-from)*e;
    cur.moved = P.small ? Math.round(v) : Math.round(v);
    renderBars();
    if(k<1) requestAnimationFrame(step); else { cur.moved=to; renderBars(); done&&done(); }
  }
  requestAnimationFrame(step);
}
function wait(ms,f){ setTimeout(f, ms/SPEED); }
function runMove(isReplay){
  if(cur.animating) return;
  var c=C(), D=P.D, M=P.M;
  cur.animating=true; cur.flashLabels=false; cur.moved=0; renderBars(); renderBarBtns();
  var first=Math.min(D,M);
  var durFor=function(n){ return P.small ? Math.max(600, n*450) : 2200; };
  setCaption(M>=D
    ? "First, <b>"+D+"</b> "+esc(unitN(D))+" leave "+esc(c.a)+"'s extra piece…"
    : "All <b>"+M+"</b> "+esc(unitN(M))+" come out of "+esc(c.a)+"'s extra piece…");
  tell([M>=D ? "sh-moveA" : "sh-moveAall"], [M>=D ? "First, the extra piece walks over. That's "+D+" "+unitN(D)+"." : "Watch. All "+M+" "+unitN(M)+" come out of "+c.a+"'s extra piece."]);
  wait(400,function(){
    tween(0,first,durFor(first),function(){
      var msg;
      if(M>D) msg="The extra piece is used up! "+esc(cap(c.a))+" is <b>back at the dotted line</b>. "+esc(cap(c.b))+" has grown <b>"+D+" above</b> the line.";
      else if(M===D) msg="The extra piece is used up! "+esc(cap(c.a))+" is <b>on the dotted line</b>. "+esc(cap(c.b))+" has grown <b>"+M+" above</b> the line.";
      else msg="Only part of the extra piece is used. "+esc(cap(c.a))+" is still <b>"+(D-M)+" above</b> the line. "+esc(cap(c.b))+" has grown <b>"+M+" above</b> the line.";
      setCaption(msg);
      tellNext(M>D ? [clip("atLine")] : [], [M>D ? "Now "+c.a+" is back at the dotted line, and "+c.b+" is "+D+" above it."
        : (M===D ? "Now "+c.a+" is right on the dotted line, and "+c.b+" is "+M+" above it."
        : cap(c.a)+" is still "+(D-M)+" above the line, and "+c.b+" is "+M+" above it.")]);
      if(M>D){
        afterVoice(2600,400,function(){
          setCaption("The other <b>"+(M-D)+"</b> "+esc(unitN(M-D))+" still have to move. They take "+esc(c.a)+" <b>below</b> the dotted line, and "+esc(c.b)+" keeps growing…");
          tellNext(["sh-moveB"], ["The rest, "+(M-D)+" more, come out from below the line. And "+c.b+" keeps growing."]);
          wait(900,function(){
            tween(first,M,durFor(M-D),function(){ wait(500,function(){ endMove(isReplay); }); });
          });
        });
      } else {
        wait(1800,function(){ endMove(isReplay); });
      }
    });
  });
}
function endMove(isReplay){

  if($("hintBtn")) $("hintBtn").onclick=function(){ if(cur.hints<3) MathHistory.hint(); cur.hints=Math.min(3,cur.hints+1); renderPanel(); tell([["sh-hint1", clip("hint2"), clip("hint3")][cur.hints-1]], ["Here's a hint. "+hintList()[cur.hints-1]]); };

var LIFE_AFTER = [1,3]; // after problems 2 and 4
// drawing on paper now happens inside the working step (problems 3, 6, 9: bars + working from memory)
function afterWorking(){ afterDraw(); }
function afterDraw(){
  if(LIFE_AFTER.indexOf(S.idx)>=0){
    cur.life = lifeCard(S.lifeCount||0); S.lifeCount=(S.lifeCount||0)+1; save();
    cur.phase="life"; renderAll();
    tell(["life-"+cur.life.c.id], ["Where do we use this in real life? "+cur.life.text+" "+cur.life.rule]);
  } else completeProblem();
}
function praiseLine(){
  var c=C(), D=P.D, M=P.M, a=D-M, amt=P.answer.amount; // a = A's end relative to the dotted line; B's end is M above
  var A=cap(c.a), B=cap(c.b);
  if(a<0) return "Yes! "+(-a)+" below plus "+M+" above makes "+amt+", so "+c.b+" has "+amt+" more.";
  if(a===0) return "Yes! "+A+" is right on the line and "+c.b+" is "+M+" above it, so "+c.b+" has "+amt+" more.";
  if(a===M) return "Yes! Both are "+M+" above the line, so they have the same.";
  if(a>M) return "Yes! "+A+" is "+a+" above the line and "+c.b+" is only "+M+" above. "+a+" take away "+M+" is "+amt+", so "+c.a+" has "+amt+" more.";
  return "Yes! Both are above the line, and "+c.b+" sticks out further. "+M+" take away "+a+" is "+amt+".";
}
function feedback(cls,msg){ cur.fb={cls:cls,msg:msg}; var f=$("feedback"); f.className="feedback "+cls; f.innerHTML=msg; }
/* feedback rule (25 Oct 2026): a wrong step says "Not yet" plus a pointer to the next thing to check */
function notYet(m){ return /^Not yet\b/.test(m) ? m : "Not yet. "+m; }
function notYetSay(m){ return ["Not yet.", String(m).replace(/^Not yet\.\s*/,"")]; }
function check(){
  var c=C(), a=P.answer;
  if(!cur.who){ feedback("try","First tap who has more (or Same)."); tell(["sh-needWho"], ["First, tap who has more, or tap Same."]); return; }
  if(cur.who!=="same" && cur.typed===""){ feedback("try","Now type how many more on the number pad."); tell(["sh-needNumber"], ["Now type how many more on the number pad."]); return; }
  var n = cur.who==="same"?0:parseInt(cur.typed,10);
  var ok = cur.who===a.who && (a.who==="same" || n===a.amount);
  cur.lastCheck={who:cur.who,n:n,ok:ok};
  if(ok){
    cur.solved=true;
    S.results[S.idx]={prediction:cur.prediction, predictionRight:cur.prediction===a.who, tries:cur.tries+1, hints:cur.hints};
    startWorking(); renderAll(true);
    if(isLesson()){ Voice.prime(); tell([clip("praise")], []); wsayAfterClips(workingEntryLines()); }
    else wsay([praiseLine()].concat(workingEntryLines()));
    return;
  }
  cur.tries++; MathHistory.miss("answer");
  // on a wrong answer: show/flash the bar labels, not the answer
  cur.flashLabels=true; renderBars(); setCaption(finalCaption());
  var msg, wid;
  if(cur.who!==a.who){ wid="sh-wrongWho";
    msg="Not yet. Look at the bars again. Whose end sticks out further past the dotted line?";
  } else if(n===P.M){ wid=clip("wrongMoved");
    msg="Not yet. "+P.M+" is how many moved. The gap changed from <b>both</b> sides — check the two labels on the bars.";
  } else if(n===P.D){ wid=clip("wrongNearly");
    msg=P.D+" was the gap at the start. The move changed it — check the two labels on the bars.";
  } else { wid=clip("wrongNearly");
    msg="Not yet. Look at the two labels on the bars: how far is each end from the dotted line?";
  }
  msg=notYet(msg); feedback("try",msg);
  tell([wid], notYetSay(msg));
}
function completeProblem(){
  var r=S.results[S.idx]; S.totalStars++; S.idx++; S.everPlayed=true; save();
  MathHistory.item(!!(r && r.tries===1 && !r.hints), S.idx>=ROUND_SIZE);
  startProblem();
}
function renderSummary(){
  renderHeader();

  $("trackA").innerHTML=""; $("trackB").innerHTML=""; $("nameA").textContent=""; $("nameB").textContent="";
  $("dotline").style.display="none"; $("counter").textContent=""; $("barbtns").innerHTML="";
  var L=lifeCard(S.lifeCount||0); S.lifeCount=(S.lifeCount||0)+1; save();
  $("panel").innerHTML='<div class="bigstar">🌟</div><p class="prompt">Well done!</p><p class="center">Total stars: <b>'+S.totalStars+'</b></p>'+lifeHTML(L)+'<div class="rowbtns" style="justify-content:center">'+(S.lesson?'<button class="big" id="newRound">Play these 5 again</button>':'<button class="big" id="moreBtn">5 more ➡️</button>')+'</div>';
  // Use the recorded five-star summary rather than the old ten-star clip.
  if(isLesson()){ tell(["life-"+L.c.id], []); wsayAfterClips(["You finished the round and got all "+ROUND_SIZE+" stars! Well done!"]); }
  else wsay(["You finished the round and got all "+ROUND_SIZE+" stars! Your first guesses were right "+pr+" out of "+res.length+" times.", "Where do we use this in real life? "+L.text+" "+L.rule]);
  var again=function(){
    S.round++; S.idx=0; S.results=[]; S.problems = S.lesson ? lessonProblems(S.small,S.round) : makeRound(S.small,false); save();
    $("dotline").style.display=""; startProblem(); MathHistory.restart();

  if($("newRound")) $("newRound").onclick=again; if($("moreBtn")) $("moreBtn").onclick=again;
}
function renderAll(){
  renderHeader(); renderStory();
  if(!cur.animating) setCaption(cur.phase==="predict"||cur.phase==="move" ? defaultCaption() : (cur.phase==="working" ? workCaption() : finalCaption()));

}

/* ---------- controls ---------- */
$("smallToggle").onclick=function(){
  if(cur && cur.animating) return;
  if(isLesson()){ // each lesson track (big / small numbers) keeps its own saved progress
    Clips.stop(); save(); S = loadLesson(!S.small); save();
    $("dotline").style.display=""; startProblem(S.idx<ROUND_SIZE);
    if(S.idx<ROUND_SIZE) tell([S.small ? "sh-smallOn" : "sh-bigOn", clip("intro")], []);

    return;
  }

  S.problems=makeRound(S.small,false,S.idx,S.problems); save();

};
$("resetBtn").onclick=function(){
  if(!confirm("Start again from the beginning? Stars will go back to 0.")) return;
  Clips.stop(); Voice.stop();

};
function renderVoiceCtl(){
  var mb=$("muteBtn"), ab=$("againBtn");
  var show = isLesson() || Voice.supported;

$("muteBtn").onclick=function(){

    if(isLesson() && lastChan==="voice"){ Voice.prime(); Voice.again(); }
    else if(isLesson()){ var l = Clips.lastIds; if(!Clips.started) Clips.unlock([]); Clips.play(["sh-voiceOn"].concat(l)); Clips.setLast(l); }
    else { if(!Voice.started) Voice.unlock([]); Voice.again(); }
  }
};
$("againBtn").onclick=function(){ if(isLesson() && lastChan!=="voice") Clips.again(); else Voice.again(); };
function renderModeCtl(){
  var b=$("modeBtn");
  b.querySelectorAll("[data-m]").forEach(function(s){ s.classList.toggle("on", s.getAttribute("data-m")===MODE); });
  b.setAttribute("aria-pressed", isLesson()?"false":"true");

    ? "Lesson mode: 5 problems, read by your recorded tutor. Your progress is saved."
    : "Practice mode: 5 fixed-bank problems at a time, read by luna.";

}
$("modeBtn").onclick=function(){
  if(cur && cur.animating) return;
  Clips.stop(); Voice.stop(); save();
  MODE = isLesson() ? "practice" : "lesson"; try{ localStorage.setItem(MODE_KEY, MODE); }catch(e){}
  S = isLesson() ? loadLesson(lessonTrackSmall()) : loadPractice(); save();

  startProblem();

function hideStart(){ $("startScreen").style.display="none"; MathHistory.restart(); }
$("startTutor").onclick=function(){
  if(Voice.muted){ Voice.setMuted(false); renderVoiceCtl(); }
  hideStart();
  if(isLesson()){
    var resumed = S.everPlayed || S.idx>0 || S.round>1;
    var ids = (S.idx>=ROUND_SIZE) ? ["sh-welcomeBack"] : [resumed ? "sh-welcomeBack" : "sh-welcome", clip("intro")];

$("startQuiet").onclick=function(){ Voice.setMuted(true); renderVoiceCtl(); hideStart(); if(isLesson()) Clips.unlock([]); else Voice.unlock([]); };
renderModeCtl();
renderVoiceCtl();
MathHistory.attach(function(){ return {mode:MODE, remaining:ROUND_SIZE-S.idx, open:$("startScreen").style.display==="none"}; });
/* host for "Test yourself" (MathCheckup): the tutor voice, and opening the Lesson at the step a test answer needs */
if(typeof CHECKUP_CLIPS==="object" && CHECKUP_CLIPS){ for(var ckk in CHECKUP_CLIPS){ if(Object.prototype.hasOwnProperty.call(CHECKUP_CLIPS,ckk) && !Object.prototype.hasOwnProperty.call(CLIPS,ckk)) CLIPS[ckk]=CHECKUP_CLIPS[ckk]; } }
window.MathHost={
  say:function(){ Voice.say.apply(null, arguments); },

  // t = {idx: Lesson problem 0-4, phase: "move" (the Move step) or "start"}
  openLesson:function(t){

    S=loadLesson(lessonTrackSmall()); var i=Math.max(0,Math.min(ROUND_SIZE-1,(t&&t.idx)|0)); S.idx=i; S.results=(S.results||[]).slice(0,i); save();
    renderModeCtl(); renderVoiceCtl(); $("dotline").style.display=""; $("startScreen").style.display="none";

/* test hook (no personal data; used by automated checks) */
function allLunaLines(){
 var out=[],oldP=P,oldCur=cur,add=function(t){if(t)out.push(t);};
 lessonList(false).concat(lessonList(true),PRACTICE_BANK).forEach(function(p){P=p;cur={prediction:null};var c=C(),D=P.D,M=P.M,a=D-M;

  hintList().forEach(function(h){add("Here's a hint. "+h);});add(praiseLine());

 });
 Object.keys(WS).forEach(function(k){add(WS[k]);});LIFE.forEach(function(c,i){var L=lifeCard(i);add("Where do we use this in real life? "+L.text+" "+L.rule);});

 ["Hello! I'm your maths tutor, and I'll help you, step by step.","Hello! Welcome back.","Not yet.","First, tap who has more, or tap Same.","Now type how many more on the number pad.","Who has more now? Tap a name, then type how many more.","Small numbers are on. Now you can count the blocks.","Big numbers are back on.","You finished the round and got all 5 stars! Well done!"].forEach(add);
